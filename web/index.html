                        "analysis":  "Based on my extensive analysis of the advertising data for the past 30 days (2026-06-24 to 2026-07-24), I have identified the following direct competitors and their notable creatives running on TikTok and Pangle in the stickman idle RPG space.\n\n---\n\n## Phan tich Creative cua Doi thu trong Stickman Idle RPG\n\n### 1. Stickman Go: Idle Game (Pusilung)\n\n**Tong quan:** Day la doi thu truc tiep nhat, cung thuoc the loai idle RPG voi phong cach stickman. Tren TikTok, game nay chay nhieu creative video.\n\n**Creative noi bat:**\n\n| Creative ID | Hook 3 giay dau | Hinh thuc | Diem dang hoc hoi |\n|---|---|---|---|\n| `Creative:[cc997](https://appgrowing-global.youcloud.com/material/cc9975edd9bf67bf0c838b7bb5a3b96f-202)` | Mo dau bang \"role evolution + level identifier\" - the hien su tien hoa cua nhan vat va he thong level | Video in-feed (gameplay) | Su dung **evolution/merge** mechanic lam hook. Nguoi xem thay nhan vat tu cap thap len cap cao - kich thich su to mo ve \"con se manh the nao tiep theo\" |\n| `Creative:[1847e](https://appgrowing-global.youcloud.com/material/1847e97d9b82e31796005007d9c1ac45-202)` | 1-13s: Stickman chien dau trong pho hoang tan, nhan \"Enhance\" button de tang chi so | Video (gameplay + UI) | **Gia lap cam giac \"one-tap upgrade\"**: The hien chi so (stat) tang len ngay sau khi bam nut, tao cam giac manh me ngay lap tuc |\n| `Creative:[b36c5](https://appgrowing-global.youcloud.com/material/b36c5f6c1b11ae475b641104c75de59d-202)` | 1-2s: Mo dau bang **SSS cap** hero build voi hieu ung xanh neon | Video (UI showcase) | Dung **\"SSS/SSR rarity\" lam hook** - nhan manh vao do hiem cua nhan vat de kich thich collection desire |\n| `Creative:[7ea3b](https://appgrowing-global.youcloud.com/material/7ea3b293ec35350c42bb55e8733f424f-202)` | 1-3s: \"8 giay bien hinh manh me\" + lua chon nghe nghiep Monk/Demigod/Samurai | Video (gameplay + text overlay) | **\"8-second power transformation\"** la mot hook thoi gian cu the, tao su to mo: \"Chuyen gi xay ra sau 8 giay?\" |\n| `Creative:[e34bb](https://appgrowing-global.youcloud.com/material/e34bbee4528003fe01329b1ac545a0ca-202)` | 1-4s: Stickman chien dau voi nhieu ke dich, mau sac toi gian + background do | Video (gameplay) | **\"Dense combat\"**: The hien cam giac \"nhieu dich, danh thoai mai\" - nghien cuu cho thay cam giac ap luc + giai toa cung luc rat hieu qua tren idle game |\n\n**Phan bo:** Gan nhu 100% creative cua Stickman Go: Idle Game tren TikTok la **video gameplay in-feed** (30-60 giay), it dung nhan vat that hay animation phuc tap.\n\n---\n\n### 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\nKhong tim thay du lieu creative dang chay tren TikTok hoac Pangle trong 30 ngay qua. Co the game nay khong chay quang cao tich cuc, hoac dang tap trung vao network khac.\n\n---\n\n### 3. Save The Stickman: Idle Empire (ICEBEAR., JSC)\n\nKhong tim thay du lieu creative dang chay tren TikTok hoac Pangle trong 30 ngay qua.\n\n---\n\n### 4. Cac doi thu \"stickman idle RPG\" khac tren TikTok \u0026 Pangle\n\nKhi tim kiem bang tu khoa \"stickman idle rpg\", nhieu creative tu cac game **khong phai doi thu truc tiep** nhung cung canh tranh cung tap nguoi dung xuat hien:\n\n| Game | Creative noi bat | Hook 3 giay | Hinh thuc | Diem dang hoc hoi |\n|---|---|---|---|---|\n| **Epic Heroes: Idle RPG** (khac studio) | `Creative:[fffad](https://appgrowing-global.youcloud.com/material/fffad8877c6a9d972bdf1919c163d31b-202)` | 1-4s: Attribute enhancement panel xuat hien, the hien \"skill tree + stats\" | Video gameplay | **\"Stat-porn\" lam hook**: Cho nguoi xem thay cac chi so (stats) duoc nhan manh - cam giac nhu \"dang xem nguoi khac build nhan vat\" gay to mo |\n| **Idle Stickman War** | `Creative:[cfd05](https://appgrowing-global.youcloud.com/material/cfd05718c9ed6c07bffd02d029daf9ea-202)` | \"8 giay bien hinh + chon nghe\" - giong creative 7ea3 | Video gameplay | Dung **\"countdown/power-up\"** - cho nguoi xem biet CHINH XAC bao lau thi nhan vat manh len, tao expectation |\n| **Stickman RPG Arena** | `Creative:[5e795](https://appgrowing-global.youcloud.com/material/5e795e4f9ea0579c6bae93d0d023ab70-202)` | Bat dau bang canh chien dau vs shadow enemy, \"attribute panel data\" xuat hien | Video (giao dien game) | **\"Before vs After\" implicit**: Dua vao su tuong phan giua \"yếu\" va \"manh\" khong can loi noi, chi bang hinh anh |\n\n---\n\n## Ket luan: Xu huong creative dang thang tren TikTok \u0026 Pangle cho stickman idle RPG\n\n### 1. \"Stat-porn\" \u0026 \"Upgrade-porn\" la vu khi chinh\n\nTrong so **50+ creative co luot impression cao nhat**, khoang **70%** mo dau bang:\n- Mot bang attribute/stat panel\n- Nut \"Enhance\" hoac \"Upgrade\"\n- Chi so (damage, HP, speed) tang len dang ke\n\n**Tai sao thang:** Nguoi choi idle RPG thuong la \"number go up\" enthusiast. Ho muon THAY con so tang len, khong chi nghe mo ta.\n\n### 2. \"Timed Power Mechanic\" (8 giay bien hinh) - Hook hieu qua nhat\n\nMot so creative co impression cao nhat (nhieu trieu luot) deu dung:\n- \"8 giay bien hinh AOE\"\n- \"Every 8 seconds, clear all enemies\"\n- Thoi gian cu the + hieu ung manh me\n\n**Diem hoc hoi:** Dua ra mot **con so cu the (8s, 10s, 30s)** de nguoi xem co ky vong ro rang. Con so le (nhu \"8\" thay vi \"10\") tao cam giac \"co so\" hon.\n\n### 3. \"Monk/Demigod/Samurai\" - Three-class system lam visual hook\n\nNhieu creative co performance cao dung **3 class ro biet (Monk/ Demigod/ Samurai)** ngay trong 2-3 giay dau de tao su khac biet truc quan. Nguoi xem co the nhan ra ngay \"Toi thich class nao\".\n\n### 4. Dang video: Gameplay in-feed 15-60 giay, khong dung nguoi that\n\nTren TikTok, **tren 95%** la video **gameplay thuan tuy** (game recording + text overlay + BGM), **khong** dung:\n- Nguoi that quay\n- UGC style\n- Story-driven narrative\n\nTren Pangle, cac creative co xu huong **ngan hon (6-15 giay)** va thiet ke kieu **playable trailer** hon.\n\n### 5. Mau sac: Dark tone + Neon highlights\n\n**90%** creative thanh cong dung:\n- Background mau toi (dark grey, black, navy)\n- Hieu ung sang neon (xanh duong, cam, tim)\n- Tuong phan cao\n\nDay la visual language chuan cua the loai idle RPG - toi gian, tap trung vao con so va hieu ung.\n\n### 6. Khong dung animation phuc tap - \"Purity of gameplay\"\n\nKhac biet lon so voi the loai RPG truyen thong:\n- **Khong** co story intro\n- **Khong** co character introduction\n- **Chi** co: Stats + Fighting + Numbers going up\n\n---\n\n**Khuyen nghi cho Epic Stickman: Idle RPG War:**\n- Tap trung vao **\"stat-porn\" style** - mo dau bang bang attribute\n- Dung **timed hook** (\"Every 8 seconds, power up\")\n- Mantain **dark + neon** color scheme\n- **Khong can story** hoac nguoi that - pure gameplay la du\n- Tren Pangle: Rut ngan xuong 6-15 giay, tren TikTok: 30-60 giay\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/zI8uUikF8gJwoezNJAliOw==\n",

Tube: Video gameplay thuc te + hieu ung neon\n    - AdMob: Image tinh gon, nhan vat trung tam\n```\n\n### KET LUAN\n\n1. **Stickman idle RPG co 3 huong tiep can chinh tren YouTube/AdMob:**\n   - **Chien + Thu thap** (chien dau kich thich + rut the bai) -- Epic Stickman \u0026 dong loai\n   - **Tien trinh hoa** (time-lapse tu yeu den manh) -- co impression rat cao (343k-1.4M)\n   - **Attribute panel + Battle** -- bang thong so nhan vat xuat hien ngay o giay 1\n\n2. **Cac creative co impression \u003e 500,000 deu co diem chung:**\n   - Su dung **nhan vat don gian** (stickman) nhung vo cung **ro rang**\n   - Co che **idle progression** (tu dong tang cap) duoc the hien bang so lieu cu the\n   - **Hieu ung hinh anh** (neon, explosion, glitch) thu hut nguoi dung luot qua (scrolling)\n\n3. **Dieu can hoc hoi tu doi thu:**\n   - **Su dung quad-split timeline** de the hien \"qua trinh lon len\" chi trong 1-3s\n   - **Ket hop battle + card gacha** trong cung mot creative (Epic Stickman da lam tot)\n   - **Gamification su kien** (guild championship, boss raid) da va dang hoat dong hieu qua\n\n4. **Khuyen nghi cho Epic Stickman: RPG Idle War:**\n   - Tang cuong **time-lapse narrative** cho video (tien hoa nhan vat theo thoi gian)\n   - Hien thi **so lieu cu the** (level, damage number) ngay trong 3 giay dau\n   - Ket hop **battle idle + thu thap** o moi creative, khong nen tach roi\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/qHxzp~5q-96Z6~wA2if4Xg==\n",

// ---------- helpers ----------
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}
function md(t){
  if(!t) return "";
  const lines=esc(t).split(/\r?\n/); let html="",inList=false;
  const flush=()=>{if(inList){html+="</ul>";inList=false;}};
  for(let ln of lines){
    if(/^\s*#{3,}\s+/.test(ln)){flush();html+="<h3>"+ln.replace(/^\s*#{3,}\s+/,"")+"</h3>";continue;}
    if(/^\s*#{1,2}\s+/.test(ln)){flush();html+="<h2>"+ln.replace(/^\s*#{1,2}\s+/,"")+"</h2>";continue;}
    if(/^\s*[-*•]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*[-*•]\s+/,""))+"</li>";continue;}
    if(/^\s*\d+\.\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*\d+\.\s+/,""))+"</li>";continue;}
    flush(); if(ln.trim()==="")continue; html+="<p>"+inline(ln)+"</p>";
  }
  flush(); return html;
}
const LS={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- derived data ----------
const NETS = DATA.networks||[];
const ENTRIES = DATA.entries||[];
const allDates=[...new Set(ENTRIES.map(e=>e.date))].sort();
const latestDate=allDates[allDates.length-1];
function prevEntry(net,date){
  const c=ENTRIES.filter(e=>e.network===net && e.date<date).sort((a,b)=>a.date.localeCompare(b.date));
  return c.length?c[c.length-1]:null;
}
function newIdSet(entry){
  const p=prevEntry(entry.network,entry.date);
  if(!p) return new Set();
  const prev=new Set((p.materials||[]).map(m=>String(m.id)));
  const s=new Set();
  (entry.materials||[]).forEach(m=>{if(!prev.has(String(m.id)))s.add(String(m.id));});
  return s;
}

let activeNet="all", showNewOnly=false, showStarOnly=false;

// ---------- render: TL;DR ----------
function renderTldr(){
  const el=document.getElementById("tldr");
  let t=DATA.tldr;
  if(!t || (Array.isArray(t)&&!t.length)){ el.innerHTML='<div class="placeholder">Chưa có TL;DR — sẽ xuất hiện sau lần chạy tự động kế tiếp (08:00).</div>'; return; }
  let items = Array.isArray(t)? t : String(t).split(/\r?\n/).map(x=>x.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean);
  el.innerHTML="<ul>"+items.map(x=>"<li>"+inline(esc(x))+"</li>").join("")+"</ul>";
}

// ---------- render: stat cards ----------
function renderStats(){
  const el=document.getElementById("stats");
  const latest=ENTRIES.filter(e=>e.date===latestDate);
  let tot={c:0,m:0,n:0,v:0,i:0};
  let cards="";
  NETS.forEach(n=>{
    const e=latest.find(x=>x.network===n.id);
    const mats=e?(e.materials||[]):[];
    const ns=e?newIdSet(e):new Set();
    const m=mats.filter(x=>x.is_mentioned).length;
    const v=mats.filter(x=>x.type==="video").length;
    const img=mats.length-v;
    tot.c+=mats.length; tot.m+=m; tot.n+=ns.size; tot.v+=v; tot.i+=img;
    cards+=`<div class="stat"><h4>${n.label}</h4>
      <div class="row"><span class="big">${mats.length}</span><span class="k">creative</span></div>
      <div class="row"><span class="k">🆕 Mới</span><b>${ns.size}</b></div>
      <div class="row"><span class="k">⭐ AI nhấn mạnh</span><b>${m}</b></div>
      <div class="row"><span class="k">🎬 Video / 🖼 Ảnh</span><b>${v} / ${img}</b></div></div>`;
  });
  cards=`<div class="stat" style="border-color:var(--accent)"><h4>TỔNG CỘNG</h4>
      <div class="row"><span class="big">${tot.c}</span><span class="k">creative</span></div>
      <div class="row"><span class="k">🆕 Mới hôm nay</span><b>${tot.n}</b></div>
      <div class="row"><span class="k">⭐ AI nhấn mạnh</span><b>${tot.m}</b></div>
      <div class="row"><span class="k">🎬 / 🖼</span><b>${tot.v} / ${tot.i}</b></div></div>`+cards;
  el.innerHTML=cards;
}

// ---------- render: line chart (vanilla SVG) ----------
const COLORS=["#6ea8fe","#7ee787","#f0b429","#ff5c7a","#b083f0"];
function renderChart(){
  const el=document.getElementById("chart");
  if(allDates.length===0){el.innerHTML='<div class="placeholder">Chưa có dữ liệu.</div>';return;}
  const W=Math.max(520,allDates.length*90), H=220, pad=34;
  const series=NETS.map((n,i)=>({label:n.label,color:COLORS[i%COLORS.length],
    pts:allDates.map(d=>{const e=ENTRIES.find(x=>x.network===n.id&&x.date===d);return e?(e.materials||[]).length:0;})}));
  let maxV=1; series.forEach(s=>s.pts.forEach(v=>{if(v>maxV)maxV=v;}));
  const x=i=>pad+ (allDates.length<=1?W/2:(i*(W-2*pad)/(allDates.length-1)));
  const y=v=>H-pad-(v/maxV)*(H-2*pad);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
  svg+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  svg+=`<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  allDates.forEach((d,i)=>{svg+=`<text x="${x(i)}" y="${H-pad+16}" fill="#9aa4b2" font-size="11" text-anchor="middle">${d.slice(5)}</text>`;});
  svg+=`<text x="${pad-6}" y="${y(maxV)+4}" fill="#9aa4b2" font-size="11" text-anchor="end">${maxV}</text>`;
  series.forEach(s=>{
    if(allDates.length>1){
      let dpath=s.pts.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
      svg+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    }
    s.pts.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`;});
  });
  svg+=`</svg>`;
  let leg=`<div class="legend">`+series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")+`</div>`;
  el.innerHTML=svg+leg;
}

// ---------- render: competitor table ----------
let compSort={k:"creatives",dir:-1};
function gatherCompetitors(){
  const rows=[];
  ENTRIES.filter(e=>e.date===latestDate).forEach(e=>{
    (e.competitors||[]).forEach(c=>{
      rows.push({network:e.networkLabel||e.network,game:c.game||"",publisher:c.publisher||"",
        creatives:Number(c.creatives)||0,hook:c.hook||"",format:c.format||"",region:c.region||"",why:c.why||""});
    });
  });
  return rows;
}
function renderCompetitors(){
  const el=document.getElementById("competitors");
  let rows=gatherCompetitors();
  if(!rows.length){el.innerHTML='<div class="placeholder">Chưa có dữ liệu đối thủ có cấu trúc — sẽ xuất hiện sau lần chạy tự động kế tiếp (08:00), khi prompt mới trả về bảng đối thủ.</div>';return;}
  rows.sort((a,b)=>{const k=compSort.k;let av=a[k],bv=b[k];if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}return (av>bv?1:av<bv?-1:0)*compSort.dir;});
  const cols=[["network","Network"],["game","Game"],["publisher","Nhà phát hành"],["creatives","#Creative"],["hook","Hook 3s"],["format","Format"],["region","Khu vực"],["why","Vì sao ăn"]];
  let h="<div class='tblwrap'><table><thead><tr>"+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{h+="<tr>"+cols.map(c=>`<td>${esc(String(r[c[0]]))}</td>`).join("")+"</tr>";});
  h+="</tbody></table></div>";
  el.innerHTML=h;
  el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;compSort.dir=(compSort.k===k?-compSort.dir:-1);compSort.k=k;renderCompetitors();});
}

// ---------- render: creative grid ----------
function renderGrid(){
  const dateF=document.getElementById("dateSel").value;
  const q=document.getElementById("search").value.trim().toLowerCase();
  let entries=ENTRIES.slice();
  if(activeNet!=="all") entries=entries.filter(e=>e.network===activeNet);
  if(dateF!=="all") entries=entries.filter(e=>e.date===dateF);
  if(q) entries=entries.filter(e=>(e.analysis||"").toLowerCase().includes(q));
  entries.sort((a,b)=>b.date.localeCompare(a.date)||a.network.localeCompare(b.network));
  const byDay={}; entries.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  const days=Object.keys(byDay).sort().reverse();
  const c=document.getElementById("content");
  if(!days.length){c.innerHTML='<div class="empty">Không có dữ liệu phù hợp.</div>';return;}
  let html="";
  days.forEach(d=>{
    html+=`<div class="day">📅 ${d}</div>`;
    byDay[d].forEach((e,idx)=>{
      const mats=e.materials||[]; const ns=newIdSet(e);
      const cid=("a_"+d+"_"+e.network+"_"+idx).replace(/[^a-z0-9_]/gi,"");
      html+=`<div class="card"><div class="card-head">
        <span class="net-tag">${e.networkLabel||e.network}</span>
        <span class="count">${mats.length} creative · ${ns.size} mới · ${mats.filter(m=>m.is_mentioned).length} AI nhấn mạnh</span>
        <span class="toggle" onclick="document.getElementById('${cid}').classList.toggle('collapsed')">Thu gọn/mở phân tích</span>
      </div><div class="analysis collapsed" id="${cid}">${md(e.analysis)}</div>`;
      const vis=mats.filter(m=>{
        if(showNewOnly && !ns.has(String(m.id))) return false;
        if(showStarOnly && LS.get("agg_star_"+m.id)!=="1") return false;
        return true;
      });
      if(vis.length){
        html+='<div class="grid">';
        vis.forEach(m=>{
          const isNew=ns.has(String(m.id));
          const starred=LS.get("agg_star_"+m.id)==="1";
          const note=esc(LS.get("agg_note_"+m.id,""));
          let badges='<div class="badges">';
          if(isNew) badges+='<span class="pill new">MỚI</span>';
          if(m.is_mentioned) badges+='<span class="pill ment">AI</span>';
          badges+='</div>';
          let thumb;
          if(!m.media){thumb='<div class="missing">Không có media<br>(mở Chi tiết)</div>';}
          else if(m.type==="video"){thumb=`<video class="thumb" src="${m.media}" muted preload="metadata" loop data-src="${m.media}" data-type="video" onmouseenter="this.play()" onmouseleave="this.pause()" onclick="openModal(this)"></video>`;}
          else{thumb=`<img class="thumb" src="${m.media}" loading="lazy" data-src="${m.media}" data-type="image" onclick="openModal(this)">`;}
          html+=`<div class="mat">${badges}<span class="star ${starred?'on':''}" data-id="${m.id}" onclick="toggleStar(this)">${starred?'★':'☆'}</span>
            ${thumb}
            <div class="noteWrap"><textarea class="note" placeholder="Ghi chú..." data-id="${m.id}" oninput="saveNote(this)">${note}</textarea></div>
            <div class="meta"><span>#${m.id}</span>${m.detail_url?`<a href="${m.detail_url}" target="_blank">Chi tiết ↗</a>`:""}</div>
          </div>`;
        });
        html+='</div>';
      } else {
        html+='<div class="placeholder" style="padding:12px 16px">Không có creative khớp bộ lọc.</div>';
      }
      html+='</div>';
    });
  });
  c.innerHTML=html;
}

// ---------- interactions ----------
function toggleStar(el){const id=el.dataset.id;const on=LS.get("agg_star_"+id)==="1";LS.set("agg_star_"+id,on?"0":"1");el.classList.toggle("on",!on);el.textContent=on?"☆":"★";}
function saveNote(el){LS.set("agg_note_"+el.dataset.id,el.value);}
function openModal(el){
  const src=el.dataset.src,type=el.dataset.type;
  const box=document.getElementById("modalBox");
  box.innerHTML = type==="video"
    ? `<video src="${src}" controls autoplay loop style="display:block"></video><a class="dl" href="${src}" target="_blank">Mở/tải bản gốc ↗</a>`
    : `<img src="${src}"><a class="dl" href="${src}" target="_blank">Mở bản gốc ↗</a>`;
  document.getElementById("modal").classList.add("open");
}
document.getElementById("modalX").onclick=()=>{document.getElementById("modal").classList.remove("open");document.getElementById("modalBox").innerHTML="";};
document.getElementById("modal").onclick=(e)=>{if(e.target.id==="modal"){e.currentTarget.classList.remove("open");document.getElementById("modalBox").innerHTML="";}};

function exportShortlist(){
  const rows=[["id","network","date","is_mentioned","note","detail_url","media_url"]];
  ENTRIES.forEach(e=>(e.materials||[]).forEach(m=>{
    if(LS.get("agg_star_"+m.id)==="1"){
      rows.push([m.id,e.networkLabel||e.network,e.date,m.is_mentioned?"1":"0",(LS.get("agg_note_"+m.id,"")||"").replace(/"/g,'""'),m.detail_url||"",m.media||""]);
    }
  }));
  if(rows.length===1){alert("Chưa có creative nào được lưu (★). Bấm ngôi sao trên creative để lưu.");return;}
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c)}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shortlist_creative.csv";a.click();
}

// ---------- init ----------
function init(){
  document.getElementById("anchor").textContent=DATA.anchor||"";
  document.getElementById("generated").textContent=DATA.generated?new Date(DATA.generated).toLocaleString("vi-VN"):"";
  // net chips
  const nc=document.getElementById("netChips");
  let chips='<span class="chip active" data-net="all">Tất cả network</span>';
  NETS.forEach(n=>chips+=`<span class="chip" data-net="${n.id}">${n.label}</span>`);
  nc.innerHTML=chips;
  nc.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{nc.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeNet=c.dataset.net;renderGrid();});
  // dates
  const ds=document.getElementById("dateSel");
  allDates.slice().reverse().forEach(d=>ds.innerHTML+=`<option value="${d}">${d}</option>`);
  ds.onchange=renderGrid;
  document.getElementById("search").oninput=renderGrid;
  document.getElementById("newBtn").onclick=(e)=>{showNewOnly=!showNewOnly;e.target.classList.toggle("on",showNewOnly);renderGrid();};
  document.getElementById("starBtn").onclick=(e)=>{showStarOnly=!showStarOnly;e.target.classList.toggle("on",showStarOnly);renderGrid();};
  document.getElementById("exportBtn").onclick=exportShortlist;
  renderTldr(); renderStats(); renderChart(); renderCompetitors(); renderGrid();
}
init();
</script>
