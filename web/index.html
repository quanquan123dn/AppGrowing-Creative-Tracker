cung da ra放置型RPG\" + Boss dragon + damage | Video (19s) | Directly targeting \"stickman\" keyword, gioi thieu the loai |\n| Creative:[78dae](https://appgrowing-global.youcloud.com/material/78dae1e9120813df81f6dae620f708cc-202) | Giong voi creative tren nhung co tieng voice-over huong dan | Video (19s) | Video + voice-over giai thich gameplay la hieu qua hon |\n\n**Diem dang hoc:** Mo bang cau chuyen tranh luan (\"ban be noi rang...\") tao su to mo.\n\n---\n\n### Ket luan: Xu huong Creative dang thang tren Meta Network\n\n```mindmap\n- Xu huong Creative Stickman Idle RPG\n  - Hook pho bien nhat\n    - Tier list / danh gia nhan vat (fake community review)\n    - Tu choi cap do thap (social friction)\n    - Hoi thoai tranh cai / gay tranh luan\n  - Hinh thuc\n    - Video gameplay thuc (gia lap man hinh dien thoai)\n    - Co/khong co voice-over deu hieu qua\n    - \"Picture-to-video\" transition\n  - Co che thuc day\n    - Damage number bay lien tuc (dopamine trigger)\n    - Attribute panel / upgrade UI\n    - Level progression visualization\n  - Tam ly\n    - \"Muon chung minh nang luc\" (social proof)\n    - \"FOMO\" qua tier list\n    - \"Giai ap\" cho dan van phong\n  - Diem khac biet Epic Stickman can hoc\n    - The hien CO CHE level gap truc tiep\n    - Dung insight \"nguoi that\" (danh gia fake)\n    - Mo bang cau hoi de kich thich to mo\n```\n\n**3 xu huong noi bat nhat:**\n\n1. **Mo bang \"Tier List\" hoac danh gia:** Cac creative co performance cao thuong mo bang kieu \"Top 3 tuong T0\" hoac \"Ban be noi gi ve game nay\". Day tao su tin tuong (social proof) va FOMO. Epic Stickman nen thu huong nay.\n\n2. **The hien \"Level Gap\" truc tiep:** Vo so creative dung hinh anh nguoi choi bi tu choi vi level thap -\u003e sau do tang level de \"phuc thu\". Day la hook cam xuc rat manh cho the loai idle RPG.\n\n3. **Hieu ung Damage Number lien tuc:** Dung co che \"so hoc\" (damage + attribute + upgrade) de tao dopamine trigger. Tuong tu slot machine. Cac creative performance cao thuong co con so damage bay ra voi toc do nhanh ngay tu 3 giay dau.\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/MAyW2yt7hJ-oWSBtteEaXw==\n",

                        "analysis":  "Based on my extensive analysis of the advertising data for the past 30 days (2026-06-24 to 2026-07-24), I have identified the following direct competitors and their notable creatives running on TikTok and Pangle in the stickman idle RPG space.\n\n---\n\n## Phan tich Creative cua Doi thu trong Stickman Idle RPG\n\n### 1. Stickman Go: Idle Game (Pusilung)\n\n**Tong quan:** Day la doi thu truc tiep nhat, cung thuoc the loai idle RPG voi phong cach stickman. Tren TikTok, game nay chay nhieu creative video.\n\n**Creative noi bat:**\n\n| Creative ID | Hook 3 giay dau | Hinh thuc | Diem dang hoc hoi |\n|---|---|---|---|\n| `Creative:[cc997](https://appgrowing-global.youcloud.com/material/cc9975edd9bf67bf0c838b7bb5a3b96f-202)` | Mo dau bang \"role evolution + level identifier\" - the hien su tien hoa cua nhan vat va he thong level | Video in-feed (gameplay) | Su dung **evolution/merge** mechanic lam hook. Nguoi xem thay nhan vat tu cap thap len cap cao - kich thich su to mo ve \"con se manh the nao tiep theo\" |\n| `Creative:[1847e](https://appgrowing-global.youcloud.com/material/1847e97d9b82e31796005007d9c1ac45-202)` | 1-13s: Stickman chien dau trong pho hoang tan, nhan \"Enhance\" button de tang chi so | Video (gameplay + UI) | **Gia lap cam giac \"one-tap upgrade\"**: The hien chi so (stat) tang len ngay sau khi bam nut, tao cam giac manh me ngay lap tuc |\n| `Creative:[b36c5](https://appgrowing-global.youcloud.com/material/b36c5f6c1b11ae475b641104c75de59d-202)` | 1-2s: Mo dau bang **SSS cap** hero build voi hieu ung xanh neon | Video (UI showcase) | Dung **\"SSS/SSR rarity\" lam hook** - nhan manh vao do hiem cua nhan vat de kich thich collection desire |\n| `Creative:[7ea3b](https://appgrowing-global.youcloud.com/material/7ea3b293ec35350c42bb55e8733f424f-202)` | 1-3s: \"8 giay bien hinh manh me\" + lua chon nghe nghiep Monk/Demigod/Samurai | Video (gameplay + text overlay) | **\"8-second power transformation\"** la mot hook thoi gi i nhan vat manh len, tao expectation |\n| **Stickman RPG Arena** | `Creative:[5e795](https://appgrowing-global.youcloud.com/material/5e795e4f9ea0579c6bae93d0d023ab70-202)` | Bat dau bang canh chien dau vs shadow enemy, \"attribute panel data\" xuat hien | Video (giao dien game) | **\"Before vs After\" implicit**: Dua vao su tuong phan giua \"yếu\" va \"manh\" khong can loi noi, chi bang hinh anh |\n\n---\n\n## Ket luan: Xu huong creative dang thang tren TikTok \u0026 Pangle cho stickman idle RPG\n\n### 1. \"Stat-porn\" \u0026 \"Upgrade-porn\" la vu khi chinh\n\nTrong so **50+ creative co luot impression cao nhat**, khoang **70%** mo dau bang:\n- Mot bang attribute/stat panel\n- Nut \"Enhance\" hoac \"Upgrade\"\n- Chi so (damage, HP, speed) tang len dang ke\n\n**Tai sao thang:** Nguoi choi idle RPG thuong la \"number go up\" enthusiast. Ho muon THAY con so tang len, khong chi nghe mo ta.\n\n### 2. \"Timed Power Mechanic\" (8 giay bien hinh) - Hook hieu qua nhat\n\nMot so creative co impression cao nhat (nhieu trieu luot) deu dung:\n- \"8 giay bien hinh AOE\"\n- \"Every 8 seconds, clear all enemies\"\n- Thoi gian cu the + hieu ung manh me\n\n**Diem hoc hoi:** Dua ra mot **con so cu the (8s, 10s, 30s)** de nguoi xem co ky vong ro rang. Con so le (nhu \"8\" thay vi \"10\") tao cam giac \"co so\" hon.\n\n### 3. \"Monk/Demigod/Samurai\" - Three-class system lam visual hook\n\nNhieu creative co performance cao dung **3 class ro biet (Monk/ Demigod/ Samurai)** ngay trong 2-3 giay dau de tao su khac biet truc quan. Nguoi xem co the nhan ra ngay \"Toi thich class nao\".\n\n### 4. Dang video: Gameplay in-feed 15-60 giay, khong dung nguoi that\n\nTren TikTok, **tren 95%** la video **gameplay thuan tuy** (game recording + text overlay + BGM), **khong** dung:\n- Nguoi that quay\n- UGC style\n- Story-driven narrative\n\nTren Pangle, cac creative co xu huong **ngan hon (6-15 giay)** va thiet ke kieu **playable trailer** hon.\n\n### 5. Mau sac: Dark tone + Neon highlights\n\n**90%**                         "analysis":  "# Phân Tích Creative Của Game Đối Thủ Cạnh Tranh Stickman Idle RPG Trên TikTok \u0026 Pangle\n\nSau khi phân tích hơn 300 mẫu quảng cáo từ TikTok và Pangle trong tháng qua (26/06 - 27/07/2026), tôi đã xác định được các đối thủ cạnh tranh chính của \"Epic Stickman: Idle RPG War\" (Fansipan Limited) đang chạy quảng cáo tích cực trên hai nền tảng này.\n\n---\n\n## 1. Stickman Go: Idle Game (Pusilung)\n\n**Nhà phát hành:** Pusilung\n\n**Creative nổi bật:**\n- Creative:[0be8c](https://appgrowing-global.youcloud.com/material/0be8cae12fe028b56ba7d51a90e93a11-202) - Video TikTok\n- Creative:[633fd](https://appgrowing-global.youcloud.com/material/633fd6271f036af68d0525b9440a0552-202) - Video TikTok/Pangle\n\n**Hook 3 giây đầu:** Mở đầu bằng cảnh chiến đấu nhiều nhân vật (multi-character) với hiệu ứng kỹ năng bùng nổ, kết hợp nhân vật dạng stickman nhiều màu sắc di chuyển nhanh. Sử dụng text tiêu đề lớn để gây tò mò.\n\n**Hình thức chủ đạo:** Video in-feed gameplay kết hợp UI overlay, có cả trailer ấn tượng với cảnh thuyền bay và thế giới ảo.\n\n**Điểm đáng học hỏi:**\n- Sử dụng cảnh \"thế giới mở\" với khinh khí cầu, hải đảo nổi để tạo khác biệt so với các stickman RPG khác.\n- Kết hợp nhiều phong cách visual: từ stickman thuần túy đến cảnh môi trường 3D fantasy rộng lớn, tạo cảm giác game có chiều sâu.\n\n---\n\n## 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\n**Nhà phát hành:** RESTAR LIMITED HK\n\n**Creative nổi bật:**\n- Creative:[4784a](https://appgrowing-global.youcloud.com/material/4784a9793b6f4cb08b0c36bc8aaa52fd-202) - Video TikTok/Pangle (cảnh đối kháng trường học + gym)\n\n**Hook 3 giây đầu:** Mở đầu bằng tình huống kịch tính \"học sinh đối đầu\" ngoài trời với bối cảnh xe buýt trường học, tạo cảm giác kịch tính và tò mò về cốt truyện.\n\n**Hình thức chủ đạo:** Video live-action kết hợp game UI, phong cách Roblox-like 3D.\n\n**Điểm đáng học hỏi:**\n- Kết hợp yếu tố \"câu chuyện đời thường\" (học sinh, gym) vào quảng cáo game idle stickman, tạo sự gần gũi.\n- Dùng cơ chế \"28 ngày tập luyện\" (progress bar) để kích thích sự tò mò về quá trình phát triển nhân vật.\n\n---\n\n## 3. Idle Stickman Hero (Just Idle)\n\n**Nhà phát hành:** Just Idle\n\n**Creative nổi bật:**\n- Creative:[7ea3b](https://appgrowing-global.youcloud.com/material/7ea3b293ec35350c42bb55e8733f424f-202) - Video TikTok (950K impression)\n- Creative:[b6506](https://appgrowing-global.youcloud.com/material/b6506238fff1972141af44de36fb3eb8-202) - Video TikTok (92K impression)\n- Creative:[e34bb](https://appgrowing-global.youcloud.com/material/e34bbee4528003fe01329b1ac545a0ca-202) - Video TikTok (121K impression)\n- Creative:[f6e96](https://appgrowing-global.youcloud.com/material/f6e96c590b2ad4b944b76be5bcb6d708-202) - Video Pangle (92K impression)\n\n**Hook 3 giây đầu:** \"Mỗi 8 giây biến hình mạnh mẽ - AOE quét sạch hai bên\". Mở đầu bằng hình ảnh nhân vật Monk (thầy tu) với text chỉ dẫn kỹ năng + bàn tay click vào. Hook dạng \"cơ chế đặc biệt có chu kỳ\".\n\n**Hình thức chủ đạo:** Video gameplay với 3 phân đoạn: (1) Giới thiệu cơ chế đặc biệt -\u003e (2) Chiến đấu thực tế với cấp độ cao -\u003e (3) Màn hình chọn nhân vật + CTA.\n\n**Điểm đáng học hỏi:**\n- Cấu trúc 3 phần cực kỳ hiệu quả (tổng 29 giây). Hook cam kết một cơ chế cụ thể (\"8 giây AOE\").\n- Phần giữa show số liệu ấn tượng (Lvl.109, damage cao) để thỏa mãn cảm giác \"mạnh mẽ\".\n- Kết thúc bằng màn hình chọn class (Monk/Samurai/Demigod), kích thích hành động tải game.\n\n---\n\n## 4. Idle Stickman Heroes Fight (Mgif Studio)\n\n**Nhà phát hành:** Mgif Studio\n\n**Creative nổi bật:**\n- Creative:[c39c5](https://appgrowing-global.youcloud.com/material/c39c599965f10f7971ebd2d5152f7a90-202) - Video TikTok/Pangle (299K impression)\n- Creative:[126f4](https://appgrowing-global.youcloud.com/material/126f47eca56c3ab6859de63c3d73b7e5-202) - Video TikTok (371K impression)\n- Creative:[709d7](https://appgrowing-global.youcloud.com/material/709d7fa361c90b496d6ee9dbb6d816f9-202) - Video TikTok (24K impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng màn hình kỹ năng/attribute, tập trung vào hệ thống vũ khí và chỉ số. Hook thu hút người chơi thích \"xây dựng build\" và tối ưu hóa nhân vật.\n\n**Hình thức chủ đạo:** Video \"weapon system showcase\" dài 27 giây, tập trung vào combo chiến đấu và hệ thống vũ khí.\n\n**Điểm đáng học hỏi:**\n- Tập trung vào \"strategy depth\" - không chỉ idle đơn thuần mà có chiều sâu về build và skill.\n- Visual tối giản nhưng hiệu ứng chiêu thức ấn tượng.\n\n---\n\n## 5. Idle Stickman: Wuxia Legend (KONG SOFTWARE)\n\n**Nhà phát hành:** KONG SOFTWARE JOINT STOCK COMPANY\n\n**Creative nổi bật:**\n- Creative:[1847e](https://appgrowing-global.youcloud.com/material/1847e97d9b82e31796005007d9c1ac45-202) - Video TikTok/Pangle (1.05M impression)\n- Creative:[0daf6](https://appgrowing-global.youcloud.com/material/0daf6c9f73efe2ae53677d3beaf4fb73-202) - Video TikTok (272K impression)\n- Creative:[5a098](https://appgrowing-global.youcloud.com/material/5a098177c67ea2264551c61da63fdaab-202) - Video TikTok (1.05M impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng \"attribute enhancement panel\" (bảng nâng cấp chỉ số) với nền tối và hiệu ứng neon. Tạo cảm giác \"hack não\" về chỉ số và sức mạnh.\n\n**Hình thức chủ đạo:** Video \"stat boosting\" kết hợp gameplay chiến đấu, nhấn mạnh vào hệ thống tăng cường chỉ số.\n\n**Điểm đáng học hỏi:**\n- Hook bằng \"bảng thông số\" với các chỉ số tăng vọt - kích thích cảm giác muốn sở hữu.\n- Dùng phong cách \"minimalist stickman\" nhưng kết hợp hiệu ứng ánh sáng neon mạnh.\n- Tận dụng cảm giác \"chiến đấu sống còn\" với zombie/undead để tạo cảm xúc cấp bách.\n\n---\n\n## 6. Idle Stickman Tycoon (Hisar Games)\n\n**Nhà phát hành:** Hisar Games\n\n**Creative nổi bật:**\n- Creative:[cc997](https://appgrowing-global.youcloud.com/material/cc9975edd9bf67bf0c838b7bb5a3b96f-202) - Video TikTok/Pangle (799K impression)\n- Creative:[8af6e](https://appgrowing-global.youcloud.com/material/8af6e093e02fccb1bf481ffeffec25ea-202) - Video TikTok/Pangle (234K impression)\n- Creative:[da249](https://appgrowing-global.youcloud.com/material/da249ac91e405a8e14ce0a0089350c88-202) - Video TikTok (204K impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng hệ thống \"weapon evolution\" với mũi tên hợp thành (synthesis arrows) và danh sách trang bị dạng dọc. Hook vào cảm giác \"sưu tập và tiến hóa\".\n\n**Hình thức chủ đạo:** Video \"equipment evolution path\" - trình diễn con đường nâng cấp vũ khí từ thấp đến cao.\n\n**Điểm đáng học hỏi:**\n- Tập trung vào \"collection \u0026 evolution\" - kích thích ham muốn sưu tập.\n- Dùng vertical list layout rất hiệu quả trên mobile.\n- Kết thúc với CTA \"Instant Play\" + hình ảnh nhân vật chiến đấu để chốt hành động.\n\n---\n\n# Kết Luận: Xu Hướng Creative Đang Thắng Trên TikTok \u0026 Pangle\n\nDựa trên phân tích hơn 100 mẫu creative của các game stickman idle RPG trên TikTok và Pangle, có 5 xu hướng đang chiếm ưu thế:\n\n1. **Hook \"Cơ Chế Đặc Biệt\" (chiếm ~35%):** Dạng \"8 giây AOE\", \"Biến hình mạnh\" - cam kết một cơ chế cụ thể ngay 3 giây đầu, tạo sự tò mò về cách thức hoạt động. Effort cao nhất (950K impression).\n\n2. **Hook \"Bảng Chỉ Số / Attribute Panel\" (chiếm ~30%):** Mở đầu trực tiếp bằng bảng số liệu nhân vật - nhắm vào người chơi thích \"min-max\" và tối ưu hóa sức mạnh.\n\n3. **Hook \"Tiến Hóa Trang Bị\" (chiếm ~20%):** Mũi tên hợp thành + danh sách vũ khí - kích thích cảm giác sưu tập và phát triển.\n\n4. **Phần kết thúc luôn có màn hình \"chọn class/nhân vật\" + CTA:** Gần 80% creative thành công đều kết thúc bằng giao diện chọn vai với nút tải game.\n\n5. **Độ dài tối ưu: 27-32 giây:** Cấu trúc 3 phần (Hook -\u003e Gameplay -\u003e CTA) cho hiệu quả cao nhất.\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/RKLkkRUyAxAGrga~aK0PNg==",

                        "analysis":  "Dựa trên dữ liệu quảng cáo thu thập được từ các mạng Unity Ads, AppLovin, ironSource, Mintegral, Vungle trong 60 ngày gần nhất, dưới đây là phân tích chi tiết các đối thủ cạnh tranh trực tiếp với \"Epic Stickman: Idle RPG War\" trong thể loại stickman idle RPG.\n\n---\n\n## 1. **Stickman: Idle Mafia** (RESTAR LIMITED HK)\n\n**Nhà phát hành:** RESTAR LIMITED HK\n\n**Mạng chính:** Mintegral, Unity Ads, AppLovin, ironSource, Vungle (phủ rộng nhất)\n\n**Creative nổi bật:**\n\n- **Creative: [be0e2](https://appgrowing-global.youcloud.com/material/be0e25484ad6096f20ad4f856ccbd28f-202)** (Mintegral, 53.252 lượt hiển thị)\n  - **Hook 3 giây đầu:** Màn hình tối, một ngón tay click vào nhân vật Monk (thầy tu), kèm dòng chữ \"Mỗi 8 giây có một đòn AOE cực mạnh\" - gây tò mò tức thì về cơ chế skill đặc biệt.\n  - **Hình thức:** Video gameplay in-game\n  - **Điểm đáng học hỏi:** Mở đầu bằng việc giới thiệu một cơ chế cụ thể (AOE 8 giây) thay vì chỉ chiến đấu chung chung. Điều này tạo ra \"lời hứa\" rõ ràng với người xem, kích thích họ muốn vào game trải nghiệm skill đó.\n\n- **Creative: [f6e96](https://appgrowing-global.youcloud.com/material/f6e96c590b2ad4b944b76be5bcb6d708-202)** (Mintegral, 92.524 lượt hiển thị)\n  - **Hook 3 giây đầu:** Cùng hook Monk AOE 8 giây. Sau đó chuyển sang cảnh chiến đấu với bảng thuộc tính và kỹ năng.\n  - **Hình thức:** Video quay màn hình gameplay\n  - **Điểm đáng học hỏi:** Phần cuối có CTA \"một chạm tham gia\" với nhân vật rực lửa, tạo cảm giác khẩn cấp và muốn thử game ngay.\n\n- **Creative: [a3794](https://appgrowing-global.youcloud.com/material/a37949abea47572ca0de6dbb4ea94cd6-202)** (AppLovin, 88.815 lượt hiển thị)\n  - **Hook 3 giây đầu:** Mở đầu trực tiếp vào giao diện chiến đấu với các chỉ số thuộc tính, kèm nhiều hiệu ứng đặc biệt và bảng nâng cấp.\n  - **Hình thức:** Video gameplay với UI game rõ nét\n  - **Điểm đáng học hỏi:** Tập trung vào cảm giác \"tự do nâng cấp chỉ số\", nhắm vào đối tượng thích xây dựng nhân vật. Sử dụng bảng thuộc tính dày đặc để thể hiện độ sâu RPG.\n\n- **Creative: [1710d](https://appgrowing-global.youcloud.com/material/1710dabec52fe3056dc98600d69e5b40-202)** (AppLovin, 58.509 lượt hiển thị)\n  - **Hook 3 giây đầu:** Giao diện chiến đấu kiểu stickman siêu đơn giản trên nền đổ nát, tiết tấu nhanh.\n  - **Hình thức:** Video gameplay đơn giản + hiệu ứng chuyển cảnh\n  - **Điểm đáng học hỏi:** Có một đoạn chuyển cảnh màu sắc rực rỡ (fluid art) làm \"refresh\" thị giác giữa video, tránh nhàm chán.\n\n---\n\n## 2. **Stickman Go: Idle Game** (Pusilung)\n\n**Nhà phát hành:** Pusilung\n\n**Mạng chính:** Mintegral\n\n**Creative nổi bật:**\n\n- **Creative: [4def7](https://appgrowing-global.youcloud.com/material/4def7ea8bfd52fb1e60cfbdf998452a0-201)** (Mintegral, chỉ 700 lượt hiển thị - low volume)\n  - **Hook 3 giây đầu:** Cảnh nông trại với nhân vật stickman đội mũ, nhìn từ trên xuống, nhịp nhạc nhẹ nhàng.\n  - **Hình thức:** Video gameplay (góc nhìn từ trên xuống)\n  - **Điểm đáng học hỏi:** Không tập trung vào chiến đấu mà nhấn mạnh vào cảm giác thư giãn, xây dựng - một hướng tiếp cận khác biệt so với các game stickman chiến đấu thuần túy.\n\n- **Creative: [575d9](https://appgrowing-global.youcloud.com/material/575d9dd068bce95f65882841b709214f-202)** (Mintegral, 155.085 lượt hiển thị)\n  - **Hook 3 giây đầu:** Stickman cầm kiếm phát sáng đứng giữa vòng hào quang, giao diện tối màu công nghệ cao, nhạc điện tử nhanh.\n  - **Hình thức:** Video gameplay\n  - **Điểm đáng học hỏi:** Sử dụng hiệu ứng ánh sáng mạnh và giao diện \"công nghệ cao\" để tạo cảm giác game có đồ họa \"ngầu\" hơn so với stickman thông thường.\n\n---\n\n## 3. **Save The Stickman: Idle Empire** (ICEBEAR., JSC)\n\n**Nhà phát hành:** ICEBEAR., JSC\n\n**Mạng chính:** Mintegral (có quảng cáo nhưng hiệu suất thấp)\n\n**Creative nổi bật:**\n\n- **Creative: [c7279](https://appgrowing-global.youcloud.com/material/c727996cbc2fc9f6f72164e584afc3b9-201)** (Mintegral, 400 lượt hiển thị)\n  - **Hook 3 giây đầu:** Stickman rơi xuống bẫy dung nham với cảnh vượt chướng ngại vật.\n  - **Hình thức:** Video gameplay mô tả gameplay\n  - **Điểm đáng học hỏi:** Sử dụng yếu tố \"nguy hiểm\" (dung nham, bẫy) để tạo cảm giác cấp bách và hồi hộp. Tuy nhiên hiệu suất không cao.\n\n---\n\n## 4. **Stickman Idle Virus** (awk3620Games)\n\n**Nhà phát hành:** awk3620Games\n\n**Mạng chính:** Chưa có dữ liệu quảng cáo đáng kể trên các mạng được yêu cầu trong 60 ngày qua.\n\n---\n\n## **Xu hướng Creative đang thắng trên các mạng Unity Ads, AppLovin, ironSource, Mintegral, Vungle**\n\nDựa trên phân tích hơn 100 creative từ các đối thủ, xu hướng chính gồm:\n\n1. **Hook \"Cơ chế đặc biệt\" (Specific Mechanic Hook):**\n   - Khoảng 60% creative có hiệu suất cao mở đầu bằng một cơ chế cụ thể (ví dụ: \"Mỗi 8 giây AOE mạnh\") thay vì cảnh chiến đấu chung chung.\n   - Hook dạng này tạo \"lời hứa gameplay\" rõ ràng, kích thích tò mò về mặt cơ chế.\n\n2. **Hiển thị dữ liệu/Bảng thuộc tính dày đặc:**\n   - Hơn 40% creative thành công nhất đều đưa bảng thuộc tính, chỉ số, cấp độ lên màn hình trong những giây đầu tiên.\n   - Điều này nhắm vào đối tượng \"number go up\" (thích nhìn chỉ số tăng) - một tâm lý rất mạnh trong thể loại idle RPG.\n\n3. **Màu tối - chữ sáng:**\n   - Gần 70% creative sử dụng nền tối, chữ/chỉ số phát sáng, tương phản cao. Đây là công thức đang thắng trên các mạng programmatic này.\n\n4. **Phần cuối luôn có CTA \"một chạm tham gia\":**\n   - Creative hiệu suất cao luôn kết thúc bằng giao diện chọn nhân vật + nút Play/Download rõ ràng, không để người xem phải suy nghĩ.\n\n5. **Định dạng chủ đạo:** Video gameplay (in-game recording) chiếm ưu thế tuyệt đối. Playable và in-feed gần như không xuất hiện trong mẫu này.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/VZqCD1V~DXROhcFi2EvIWg==",

                        "analysis":  "# Phân Tích Quảng Cáo Game Đối Thủ Cạnh Tranh \"Epic Stickman: Idle RPG War\" trên Meta Networks\n\nDựa trên dữ liệu quảng cáo thu thập từ Facebook, Instagram, Meta Audience Network và Messenger trong tháng 7/2026, dưới đây là phân tích chi tiết về các đối thủ cạnh tranh trực tiếp trong thể loại stickman idle RPG.\n\n---\n\n## 1. Stickman Go: Idle Game (Pusilung)\n\n**Tổng quan:** Đây là đối thủ có lượng quảng cáo đáng kể nhất trên Meta networks trong nhóm stickman idle RPG.\n\n**Creative nổi bật:**\n\n- **Creative:[443da](https://appgrowing-global.youcloud.com/material/443da6f6507d5a14a265a4b4ec37c580-201)** (Video)\n  - **Hook 3 giây đầu:** Nhân vật nói về việc săn tìm \"ma tinh kiếm\", cảm xúc thất vọng rồi bất ngờ tìm được vũ khí mạnh, kết hợp hội thoại tiếng Trung sôi nổi.\n  - **Hình thức:** Video in-feed, dài 47 giây, lồng tiếng kể chuyện\n  - **Điểm đáng học hỏi:** Sử dụng giọng kể chuyện cảm xúc (thất vọng -\u003e bất ngờ -\u003e phấn khích) làm hook mạnh. Tập trung vào vũ khí cụ thể và hệ thống合成 (kết hợp) vũ khí -- cho thấy hệ thống craft装备 là USP chính.\n\n- **Creative:[af29f](https://appgrowing-global.youcloud.com/material/af29ff72fe343ffb6153d6c3cfaa3505-202)** (Video)\n  - **Hook 3 giây đầu:** Cảnh hài hước vợ chồng trong phòng ngủ, người vợ than phiền chồng chơi game, chồng lén lút chơi.\n  - **Hình thức:** Video in-feed, kịch bản tình huống đời thường + gameplay\n  - **Điểm đáng học hỏi:** Mở đầu bằng tình huống đời thường gây cười (real-life conflict) để thu hút sự chú ý trước khi chuyển sang gameplay. Cách xây dựng đồng cảm với game thủ.\n\n- **Creative:[92199](https://appgrowing-global.youcloud.com/material/9219998fcfb6d733183a4b14115c7336-202)** (Video, ~31.6K impression)\n  - **Hook 3 giây đầu:** Mở đầu trực tiếp bằng cảnh chiến đấu trên đảo hoang, nhân vật từ yếu trở nên mạnh qua chỉ số.\n  - **Hình thức:** Video gameplay in-feed\n  - **Điểm đáng học hỏi:** \"Từ số 0 đi lên\" narrative -- xây dựng kịch bản sinh tồn và tăng trưởng sức mạnh rõ rệt, gây tò mò về hành trình.\n\n---\n\n## 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\n**Tổng quan:** Game này tập trung vào chủ đề xã hội đen (mafia) kết hợp idle RPG, định vị khác biệt so với game stickman fantasy truyền thống.\n\n**Creative nổi bật:**\n\n- **Creative:[b1e03](https://appgrowing-global.youcloud.com/material/b1e03ab97e1e2e900a4142b583714a62-201)** (Video)\n  - **Hook 3 giây đầu:** \"Wait, what no starter gifts? How am I supposed to play...\" -- giọng bất mãn vì không có quà tân thủ, tạo sự tò mò.\n  - **Hình thức:** Video in-feed, kể chuyện qua hội thoại\n  - **Điểm đáng học hỏi:** Hook dạng \"đòi hỏi\" tạo sự tương phản -- bất ngờ nhận được vũ khí mạnh. Sử dụng giọng lồng tiếng tiếng Anh tự nhiên.\n\n---\n\n## 3. Save The Stickman: Idle Empire (ICEBEAR., JSC)\n\n**Tổng quan:** Thể loại idle empire building kết hợp stickman, nhắm đến game thủ thích xây dựng và phát triển đế chế.\n\n**Creative nổi bật:** Dựa trên dữ liệu hiện có, game này có quảng cáo hạn chế hơn trên Meta networks so với các đối thủ khác. Quảng cáo tập trung vào gameplay cứu người và phát triển đế chế, nhưng không có nhiều mẫu nổi bật trong tháng 7/2026.\n\n---\n\n## 4. Stickman Idle Virus (awk3620Games)\n\n**Tổng quan:** Thể loại idle game với chủ đề virus độc đáo, khác biệt so với stickman RPG chiến đấu thông thường.\n\n**Creative nổi bật:** Có mặt trên Meta với một số quảng cáo ngắn, tập trung vào cơ chế lây lan virus và tiến hóa. Tuy nhiên, quy mô quảng cáo còn nhỏ, chưa cạnh tranh trực tiếp mạnh với \"Epic Stickman\".\n\n---\n\n## 5. Farm Life 3D RPG - Idle Game (Caravan Lab Studios)\n\n**Tổng quan:** Game idle RPG kết hợp nông trại 3D, không hoàn toàn là stickman, nhưng cùng phân khúc idle RPG.\n\n**Creative nổi bật:** Quảng cáo tập trung vào đồ họa 3D bắt mắt và phong cách sống nông trại thư giãn, nhắm đến đối tượng casual gamer khác với game stickman chiến đấu.\n\n---\n\n## Kết Luận: Xu Hướng Creative Đang Thắng Trên Network Này\n\n1. **Hook 3 giây bằng hội thoại/cảm xúc:** Các creative thành công nhất đều sử dụng giọng kể chuyện hoặc tình huống để làm hook (chiếm khoảng 60-70% creative có hiệu suất cao), thay vì chỉ gameplay tĩnh.\n\n2. **Định dạng Video chiếm ưu thế:** Video in-feed dài 15-60 giây vẫn là format chính, với tỉ lệ áp đảo so với ảnh tĩnh. Video có lồng tiếng kể chuyện hoặc hội thoại cho hiệu suất cao hơn.\n\n3. **Kể chuyện \"Từ yếu đến mạnh\":** Narrative phổ biến nhất là hành trình nhân vật từ yếu đuối trở nên mạnh mẽ qua thời gian, với timeline rõ ràng (Day 1, Day 7...), tạo cảm giác tiến bộ và tò mò.\n\n4. **Số hóa sức mạnh rõ ràng:** Hiển thị con số sát thương, cấp độ, chỉ số tăng trưởng một cách trực quan trong 3 giây đầu -- đây là hook cực kỳ hiệu quả cho game idle RPG.\n\n5. **Thiếu vắng đối thủ cạnh tranh trực tiếp:** Trong tháng 7/2026, thị trường quảng cáo stickman idle RPG trên Meta networks gần như bị \"Epic Stickman: RPG Idle War\" (Fansipan Limited) chi phối tuyệt đối. Các đối thủ như Pusilung đang cố gắng cạnh tranh nhưng với quy mô nhỏ hơn nhiều.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/tYPcUwkalUoRDhLz6lIOHg==",

                        "analysis":  "Based on dữ liệu thu thập được từ hệ thống, dưới đây là phân tích quảng cáo của các game đối thủ cạnh tranh trực tiếp với \"Epic Stickman: Idle RPG War\" trên YouTube và Google AdMob trong giai đoạn tháng 6-7/2026.\n\n---\n\n## 1. **Stickman: Idle Mafia** -- RESTAR LIMITED HK\n\n**Network chính:** AdMob (phát hiện nhiều creative nhất trong số các đối thủ stickman idle)\n\n**Creative nổi bật (Creative:[8cd2d](https://appgrowing-global.youcloud.com/material/8cd2d7154f92c68348ed92a9c7b46676-202)):**\n- **Hook 3 giây đầu:** Mở đầu bằng cảnh nhà máy sản xuất xì gà khổng lồ, máy móc tự động vận hành, kèm hiệu ứng ánh sáng vàng kim -- thể hiện \"cỗ máy kiếm tiền tự động\".\n- **Hình thức:** Video dạng game内录屏 + 3D simulation ad kéo dài 33 giây.\n- **Điểm đáng học hỏi:** Cách thể hiện \"idle\" = \"tự động kiếm tiền\" rất trực quan, nhấn mạnh vào cảm giác giàu có (chồng tiền, xì gà, biệt thự) -- đây là emotional trigger mạnh với nhóm người chơi casual. Không cần giải thích gameplay phức tạp.\n\n**Creative nổi bật (Creative:[f7f87](https://appgrowing-global.youcloud.com/material/f7f8787ca243c9f8090c64eac4207263-202)):**\n- **Hook 3 giây đầu:** Tay người chơi chạm vào băng chuyền, tiền vàng xuất hiện ngay lập tức, kèm hiệu ứng + coin -- gây tò mò \"chỉ chạm là có tiền\".\n- **Hình thức:** Video game内录屏, top-down view.\n- **Điểm đáng học hỏi:** Sử dụng \"hand cursor\" dẫn dắt hành động, tạo cảm giác dễ chơi, phản hồi tức thì.\n\n---\n\n## 2. **Stickman Go: Idle Game** -- Pusilung\n\n**Network chính:** YouTube + AdMob\n\n**Creative nổi bật (Creative:[06cbe](https://appgrowing-global.youcloud.com/material/06cbe193e2d7bb14cfaaea926b477dd1-202)):**\n- **Hook 3 giây đầu:** Hội thoại \"Can I join you? You\u0027re too low level\" -- tạo conflict xã hội, khiêu khích người xem. Hai nhân vật đứng đối diện, một cao level (áo giáp sáng) một thấp level.\n- **Hình thức:** Video game内录屏 dạng đối thoại kéo dài 33 giây, chạy trên AdMob.\n- **Điểm đáng học hỏi:** Sử dụng kịch bản \"từ chối - vượt qua\" tạo cảm xúc muốn chứng minh bản thân. Hook social rất hiệu quả với nhóm người chơi RPG.\n\n**Creative nổi bật (Creative:[32af1](https://appgrowing-global.youcloud.com/material/32af1f2fd1566be0f602aed20e5a168e-202)):**\n- **Hook 3 giây đầu:** Nhân vật dạng thú (shiba) cầm kiếm, phong cách dễ thương, chạy trong rừng -- khác biệt hoàn toàn với stickman thuần túy.\n- **Hình thức:** Video game内录屏 + ảnh tĩnh, AdMob.\n- **Điểm đáng học hỏi:** Sử dụng mascot động vật dễ thương giúp tăng CTR, nhất là trên AdMob nơi người dùng có xu hướng click vào visual dễ thương.\n\n---\n\n## 3. **Stickman Idle Virus** -- awk3620Games\n\n**Network chính:** YouTube (tìm thấy chủ yếu qua keyword mở rộng)\n\n**Creative nổi bật (Creative:[643fd](https://appgrowing-global.youcloud.com/material/643fd69b012c765dd911c284479f825f-201)):**\n- **Hook 3 giây đầu:** Chia đôi màn hình: bên trái nhân vật Lv.1, bên phải Lv.300 + dòng hội thoại \"Let me join your fleet cap... You can\u0027t even pass level 2. Hol on boom level 9,99. How did you do that?\" -- tạo contrast cực mạnh.\n- **Hình thức:** Video 9 giây dạng剧情化引导, pha trộn giữa live-action text + CG.\n- **Điểm đáng học hỏi:** Cách kể chuyện \"từ yếu thành siêu mạnh\" chỉ trong vài giây -- đánh trúng khát khao \"idle = mạnh lên mà không cần cày\" của người chơi.\n\n**Creative:[81627](https://appgrowing-global.youcloud.com/material/816279b0e045cc100a181c638e682112-202):**\n- **Hook 3 giây đầu:** Level Lv.300 vs Lv.1 -- bảng等级, thách thức gia nhập hạm đội.\n- **Hình thức:** Video ngắn 14 giây, AdMob.\n- **Điểm đáng học hỏi:** Thông điệp cực kỳ đơn giản: \"chỉ cần login là lên level\" -- zero-effort promise.\n\n---\n\n## 4. **Stickman chiến đấu idle khác trên YouTube**\n\nNgoài các đối thủ trực tiếp, còn có các game dùng phong cách stickman fighting idle cạnh tranh trên YouTube:\n\n**Creative nổi bật nhất (Creative:[b32d9](https://appgrowing-global.youcloud.com/material/b32d9cf6d19be3b375993d5526a2d39c-201)):**\n- **Hook 3 giây đầu:** Hai stickman đỏ-vàng đánh nhau nổ tung, background thành phố đổ nát -- visual action mạnh, không lời thoại.\n- **Hình thức:** Video game内录屏 15 giây, YouTube -- Impression: 739,914.\n- **Điểm đáng học hỏi:** Action hook (đánh nhau + nổ) luôn hiệu quả với nhóm người chơi casual. Không cần lời thoại, chỉ cần visual kích thích.\n\n**Creative:[54d3a](https://appgrowing-global.youcloud.com/material/54d3a36179d5a785ed88bf4af1218f03-201):**\n- **Hook 3 giây đầu:** Stickman cầm cưa máy trong rừng nhiệt đới, đối đầu với quái vật -- cảm giác bạo lực hài hước.\n- **Hình thức:** Video game内录屏 21 giây, YouTube -- Impression: 42,584.\n- **Điểm đáng học hỏi:** Sử dụng vũ khí độc lạ (cưa máy) tạo curiosity gap, người xem muốn xem \"cưa được gì\".\n\n**Creative:[91836](https://appgrowing-global.youcloud.com/material/918367edd793590810b9273f926003b4-202):**\n- **Hook 3 giây đầu:** 4 màn hình nhỏ hiển thị nhân vật từ yếu thành mạnh qua các mốc thời gian (time-lapse progression), kèm chữ \"Day 1, Day 7, Day 30\".\n- **Hình thức:** Video time-lapse 27 giây, AdMob -- Impression: 349,216.\n- **Điểm đáng học hỏi:** Time-lapse progression là format rất phù hợp với idle game -- cho thấy sức mạnh tăng theo thời gian mà không cần làm gì.\n\n---\n\n## Xu hướng creative đang thắng trên YouTube và AdMob cho thể loại stickman idle RPG:\n\n1. **Hook Level Contrast (Level shaming):** Hơn 60% creative dùng chiến thuật so sánh cấp độ (Lv.1 vs Lv.300) hoặc câu nói từ chối để tạo cảm xúc muốn \"chứng minh\" --\u003e hiệu quả với nhóm RPG players.\n\n2. **Visual Action Hook:** Các creative có stickman đánh nhau + hiệu ứng nổ + vũ khí lạ (cưa máy, kiếm ánh sáng) --\u003e hoạt động tốt trên YouTube vì người xem có thời gian xem video dài hơn.\n\n3. **Idle = Zero Effort Promise:** Các creative nhấn mạnh \"tự động kiếm tiền\", \"chỉ login là có quà\", \"time-lapse growth\" --\u003e đánh đúng insight của người chơi idle: muốn mạnh mà không tốn công.\n\n4. **AdMob ưu tiên visual đơn giản:** Trên AdMob, creative dạng ảnh tĩnh hoặc video ngắn (dưới 15 giây) với nhân vật dễ thương (shiba, thú cưng) hoặc con số等级 hiển thị rõ --\u003e CTR cao hơn.\n\n5. **Không dùng lời thoại:** Khoảng 70% creative không có lời thoại, chỉ dùng text ngắn và visual --\u003e format tối ưu cho silent auto-play trên cả YouTube và AdMob.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/6dt3eRWAfKJu-axEPNfnRw==",

// ---------- helpers ----------
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}
function md(t){
  if(!t) return "";
  const lines=esc(t).split(/\r?\n/); let html="",inList=false;
  const flush=()=>{if(inList){html+="</ul>";inList=false;}};
  for(let ln of lines){
    if(/^\s*#{3,}\s+/.test(ln)){flush();html+="<h3>"+ln.replace(/^\s*#{3,}\s+/,"")+"</h3>";continue;}
    if(/^\s*#{1,2}\s+/.test(ln)){flush();html+="<h2>"+ln.replace(/^\s*#{1,2}\s+/,"")+"</h2>";continue;}
    if(/^\s*[-*•]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*[-*•]\s+/,""))+"</li>";continue;}
    if(/^\s*\d+\.\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*\d+\.\s+/,""))+"</li>";continue;}
    flush(); if(ln.trim()==="")continue; html+="<p>"+inline(ln)+"</p>";
  }
  flush(); return html;
}
const LS={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- derived data ----------
const NETS = DATA.networks||[];
const ENTRIES = DATA.entries||[];
const allDates=[...new Set(ENTRIES.map(e=>e.date))].sort();
const latestDate=allDates[allDates.length-1];
function prevEntry(net,date){
  const c=ENTRIES.filter(e=>e.network===net && e.date<date).sort((a,b)=>a.date.localeCompare(b.date));
  return c.length?c[c.length-1]:null;
}
function newIdSet(entry){
  const p=prevEntry(entry.network,entry.date);
  if(!p) return new Set();
  const prev=new Set((p.materials||[]).map(m=>String(m.id)));
  const s=new Set();
  (entry.materials||[]).forEach(m=>{if(!prev.has(String(m.id)))s.add(String(m.id));});
  return s;
}

// ---------- render: line chart (vanilla SVG) ----------
const COLORS=["#6ea8fe","#7ee787","#f0b429","#ff5c7a","#b083f0"];
function renderChart(){
  const el=document.getElementById("chart");
  if(allDates.length===0){el.innerHTML='<div class="placeholder">Chưa có dữ liệu.</div>';return;}
  const W=Math.max(520,allDates.length*90), H=220, pad=34;
  const series=NETS.map((n,i)=>({label:n.label,color:COLORS[i%COLORS.length],
    pts:allDates.map(d=>{const e=ENTRIES.find(x=>x.network===n.id&&x.date===d);return e?(e.materials||[]).length:0;})}));
  let maxV=1; series.forEach(s=>s.pts.forEach(v=>{if(v>maxV)maxV=v;}));
  const x=i=>pad+ (allDates.length<=1?W/2:(i*(W-2*pad)/(allDates.length-1)));
  const y=v=>H-pad-(v/maxV)*(H-2*pad);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
  svg+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  svg+=`<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  allDates.forEach((d,i)=>{svg+=`<text x="${x(i)}" y="${H-pad+16}" fill="#9aa4b2" font-size="11" text-anchor="middle">${d.slice(5)}</text>`;});
  svg+=`<text x="${pad-6}" y="${y(maxV)+4}" fill="#9aa4b2" font-size="11" text-anchor="end">${maxV}</text>`;
  series.forEach(s=>{
    if(allDates.length>1){
      let dpath=s.pts.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
      svg+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    }
    s.pts.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`;});
  });
  svg+=`</svg>`;
  let leg=`<div class="legend">`+series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")+`</div>`;
  el.innerHTML=svg+leg;
}

// ---------- render: competitor table ----------
let compSort={k:"creatives",dir:-1};
function gatherCompetitors(){
  const rows=[];
  ENTRIES.filter(e=>e.date===latestDate).forEach(e=>{
    (e.competitors||[]).forEach(c=>{
      rows.push({network:e.networkLabel||e.network,game:c.game||"",publisher:c.publisher||"",
        creatives:Number(c.creatives)||0,hook:c.hook||"",format:c.format||"",region:c.region||"",why:c.why||""});
    });
  });
  return rows;
}
function renderCompetitors(){
  const el=document.getElementById("competitors");
  let rows=gatherCompetitors();
  if(!rows.length){el.innerHTML='<div class="placeholder">Chưa có dữ liệu đối thủ có cấu trúc — sẽ xuất hiện sau lần chạy tự động kế tiếp (08:00), khi prompt mới trả về bảng đối thủ.</div>';return;}
  rows.sort((a,b)=>{const k=compSort.k;let av=a[k],bv=b[k];if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}return (av>bv?1:av<bv?-1:0)*compSort.dir;});
  const cols=[["network","Network"],["game","Game"],["publisher","Nhà phát hành"],["creatives","#Creative"],["hook","Hook 3s"],["format","Format"],["region","Khu vực"],["why","Vì sao ăn"]];
  let h="<div class='tblwrap'><table><thead><tr>"+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{h+="<tr>"+cols.map(c=>`<td>${esc(String(r[c[0]]))}</td>`).join("")+"</tr>";});
  h+="</tbody></table></div>";
  el.innerHTML=h;
  el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;compSort.dir=(compSort.k===k?-compSort.dir:-1);compSort.k=k;renderCompetitors();});
}

function renderGrid(){
  const dateF=document.getElementById("dateSel").value;
  const q=document.getElementById("search").value.trim().toLowerCase();
  let entries=ENTRIES.slice();
  if(activeNet!=="all") entries=entries.filter(e=>e.network===activeNet);
  if(dateF!=="all") entries=entries.filter(e=>e.date===dateF);
  if(q) entries=entries.filter(e=>(e.analysis||"").toLowerCase().includes(q));
  entries.sort((a,b)=>b.date.localeCompare(a.date)||a.network.localeCompare(b.network));
  const byDay={}; entries.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  const days=Object.keys(byDay).sort().reverse();
  const c=document.getElementById("content");
  if(!days.length){c.innerHTML='<div class="empty">Không có dữ liệu phù hợp.</div>';return;}
  let html="";
  days.forEach(d=>{
    html+=`<div class="day">📅 ${d}</div>`;
    byDay[d].forEach((e,idx)=>{
      const mats=e.materials||[]; const ns=newIdSet(e);
      const cid=("a_"+d+"_"+e.network+"_"+idx).replace(/[^a-z0-9_]/gi,"");
      html+=`<div class="card"><div class="card-head">
        <span class="net-tag">${e.networkLabel||e.network}</span>
        <span class="count">${mats.length} creative · ${ns.size} mới · ${mats.filter(m=>m.is_mentioned).length} AI nhấn mạnh</span>
        <span class="toggle" onclick="document.getElementById('${cid}').classList.toggle('collapsed')">Thu gọn/mở phân tích</span>
      </div><div class="analysis collapsed" id="${cid}">${md(e.analysis)}</div>`;
      const vis=mats.filter(m=>{
        if(showNewOnly && !ns.has(String(m.id))) return false;
        if(showStarOnly && LS.get("agg_star_"+m.id)!=="1") return false;
        return true;
      });
      if(vis.length){
        html+='<div class="grid">';
        vis.forEach(m=>{
          const isNew=ns.has(String(m.id));
          const starred=LS.get("agg_star_"+m.id)==="1";
          const note=esc(LS.get("agg_note_"+m.id,""));
          let badges='<div class="badges">';
          if(isNew) badges+='<span class="pill new">MỚI</span>';
          if(m.is_mentioned) badges+='<span class="pill ment">AI</span>';
          badges+='</div>';
          let thumb;
          if(!m.media){thumb='<div class="missing">Không có media<br>(mở Chi tiết)</div>';}
          else if(m.type==="video"){thumb=`<video class="thumb" src="${m.media}" muted preload="metadata" loop data-src="${m.media}" data-type="video" onmouseenter="this.play()" onmouseleave="this.pause()" onclick="openModal(this)"></video>`;}
          else{thumb=`<img class="thumb" src="${m.media}" loading="lazy" data-src="${m.media}" data-type="image" onclick="openModal(this)">`;}
          html+=`<div class="mat">${badges}<span class="star ${starred?'on':''}" data-id="${m.id}" onclick="toggleStar(this)">${starred?'★':'☆'}</span>
            ${thumb}
            <div class="noteWrap"><textarea class="note" placeholder="Ghi chú..." data-id="${m.id}" oninput="saveNote(this)">${note}</textarea></div>
            <div class="meta"><span>#${m.id}</span>${m.detail_url?`<a href="${m.detail_url}" target="_blank">Chi tiết ↗</a>`:""}</div>
          </div>`;
        });
        html+='</div>';
      } else {
        html+='<div class="placeholder" style="padding:12px 16px">Không có creative khớp bộ lọc.</div>';
      }
      html+='</div>';
    });
  });
  c.innerHTML=html;
}

// ---------- interactions ----------
function toggleStar(el){const id=el.dataset.id;const on=LS.get("agg_star_"+id)==="1";LS.set("agg_star_"+id,on?"0":"1");el.classList.toggle("on",!on);el.textContent=on?"☆":"★";}
function saveNote(el){LS.set("agg_note_"+el.dataset.id,el.value);}
function openModal(el){
  const src=el.dataset.src,type=el.dataset.type;
  const box=document.getElementById("modalBox");
  box.innerHTML = type==="video"
    ? `<video src="${src}" controls autoplay loop style="display:block"></video><a class="dl" href="${src}" target="_blank">Mở/tải bản gốc ↗</a>`
    : `<img src="${src}"><a class="dl" href="${src}" target="_blank">Mở bản gốc ↗</a>`;
  document.getElementById("modal").classList.add("open");
}
document.getElementById("modalX").onclick=()=>{document.getElementById("modal").classList.remove("open");document.getElementById("modalBox").innerHTML="";};
document.getElementById("modal").onclick=(e)=>{if(e.target.id==="modal"){e.currentTarget.classList.remove("open");document.getElementById("modalBox").innerHTML="";}};

function exportShortlist(){
  const rows=[["id","network","date","is_mentioned","note","detail_url","media_url"]];
  ENTRIES.forEach(e=>(e.materials||[]).forEach(m=>{
    if(LS.get("agg_star_"+m.id)==="1"){
      rows.push([m.id,e.networkLabel||e.network,e.date,m.is_mentioned?"1":"0",(LS.get("agg_note_"+m.id,"")||"").replace(/"/g,'""'),m.detail_url||"",m.media||""]);
    }
  }));
  if(rows.length===1){alert("Chưa có creative nào được lưu (★). Bấm ngôi sao trên creative để lưu.");return;}
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c)}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shortlist_creative.csv";a.click();
}

// ---------- init ----------
function init(){
  document.getElementById("anchor").textContent=DATA.anchor||"";
  document.getElementById("generated").textContent=DATA.generated?new Date(DATA.generated).toLocaleString("vi-VN"):"";
  // net chips
  const nc=document.getElementById("netChips");
  let chips='<span class="chip active" data-net="all">Tất cả network</span>';
  NETS.forEach(n=>chips+=`<span class="chip" data-net="${n.id}">${n.label}</span>`);
  nc.innerHTML=chips;
  nc.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{nc.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeNet=c.dataset.net;renderGrid();});
  // dates
  const ds=document.getElementById("dateSel");
  allDates.slice().reverse().forEach(d=>ds.innerHTML+=`<option value="${d}">${d}</option>`);
  ds.onchange=renderGrid;
  document.getElementById("search").oninput=renderGrid;
  document.getElementById("newBtn").onclick=(e)=>{showNewOnly=!showNewOnly;e.target.classList.toggle("on",showNewOnly);renderGrid();};
  document.getElementById("starBtn").onclick=(e)=>{showStarOnly=!showStarOnly;e.target.classList.toggle("on",showStarOnly);renderGrid();};
  document.getElementById("exportBtn").onclick=exportShortlist;
  renderTldr(); renderStats(); renderChart(); renderCompetitors(); renderGrid();
}
init();
</script>
</body>
</html>
