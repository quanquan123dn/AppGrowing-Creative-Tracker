                        "analysis":  "Based on my extensive analysis of the advertising data for the past 30 days (2026-06-24 to 2026-07-24), I have identified the following direct competitors and their notable creatives running on TikTok and Pangle in the stickman idle RPG space.\n\n---\n\n## Phan tich Creative cua Doi thu trong Stickman Idle RPG\n\n### 1. Stickman Go: Idle Game (Pusilung)\n\n**Tong quan:** Day la doi thu truc tiep nhat, cung thuoc the loai idle RPG voi phong cach stickman. Tren TikTok, game nay chay nhieu creative video.\n\n**Creative noi bat:**\n\n| Creative ID | Hook 3 giay dau | Hinh thuc | Diem dang hoc hoi |\n|---|---|---|---|\n| `Creative:[cc997](https://appgrowing-global.youcloud.com/material/cc9975edd9bf67bf0c838b7bb5a3b96f-202)` | Mo dau bang \"role evolution + level identifier\" - the hien su tien hoa cua nhan vat va he thong level | Video in-feed (gameplay) | Su dung **evolution/merge** mechanic lam hook. Nguoi xem thay nhan vat tu cap thap len cap cao - kich thich su to mo ve \"con se manh the nao tiep theo\" |\n| `Creative:[1847e](https://appgrowing-global.youcloud.com/material/1847e97d9b82e31796005007d9c1ac45-202)` | 1-13s: Stickman chien dau trong pho hoang tan, nhan \"Enhance\" button de tang chi so | Video (gameplay + UI) | **Gia lap cam giac \"one-tap upgrade\"**: The hien chi so (stat) tang len ngay sau khi bam nut, tao cam giac manh me ngay lap tuc |\n| `Creative:[b36c5](https://appgrowing-global.youcloud.com/material/b36c5f6c1b11ae475b641104c75de59d-202)` | 1-2s: Mo dau bang **SSS cap** hero build voi hieu ung xanh neon | Video (UI showcase) | Dung **\"SSS/SSR rarity\" lam hook** - nhan manh vao do hiem cua nhan vat de kich thich collection desire |\n| `Creative:[7ea3b](https://appgrowing-global.youcloud.com/material/7ea3b293ec35350c42bb55e8733f424f-202)` | 1-3s: \"8 giay bien hinh manh me\" + lua chon nghe nghiep Monk/Demigod/Samurai | Video (gameplay + text overlay) | **\"8-second power transformation\"** la mot hook thoi gian cu the, tao su to mo: \"Chuyen gi xay ra sau 8 giay?\" |\n| `Creative:[e34bb](https://appgrowing-global.youcloud.com/material/e34bbee4528003fe01329b1ac545a0ca-202)` | 1-4s: Stickman chien dau voi nhieu ke dich, mau sac toi gian + background do | Video (gameplay) | **\"Dense combat\"**: The hien cam giac \"nhieu dich, danh thoai mai\" - nghien cuu cho thay cam giac ap luc + giai toa cung luc rat hieu qua tren idle game |\n\n**Phan bo:** Gan nhu 100% creative cua Stickman Go: Idle Game tren TikTok la **video gameplay in-feed** (30-60 giay), it dung nhan vat that hay animation phuc tap.\n\n---\n\n### 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\nKhong tim thay du lieu creative dang chay tren TikTok hoac Pangle trong 30 ngay qua. Co the game nay khong chay quang cao tich cuc, hoac dang tap trung vao network khac.\n\n---\n\n### 3. Save The Stickman: Idle Empire (ICEBEAR., JSC)\n\nKhong tim thay du lieu creative dang chay tren TikTok hoac Pangle trong 30 ngay qua.\n\n---\n\n### 4. Cac doi thu \"stickman idle RPG\" khac tren TikTok \u0026 Pangle\n\nKhi tim kiem bang tu khoa \"stickman idle rpg\", nhieu creative tu cac game **khong phai doi thu truc tiep** nhung cung canh tranh cung tap nguoi dung xuat hien:\n\n| Game | Creative noi bat | Hook 3 giay | Hinh thuc | Diem dang hoc hoi |\n|---|---|---|---|---|\n| **Epic Heroes: Idle RPG** (khac studio) | `Creative:[fffad](https://appgrowing-global.youcloud.com/material/fffad8877c6a9d972bdf1919c163d31b-202)` | 1-4s: Attribute enhancement panel xuat hien, the hien \"skill tree + stats\" | Video gameplay | **\"Stat-porn\" lam hook**: Cho nguoi xem thay cac chi so (stats) duoc nhan manh - cam giac nhu \"dang xem nguoi khac build nhan vat\" gay to mo |\n| **Idle Stickman War** | `Creative:[cfd05](https://appgrowing-global.youcloud.com/material/cfd05718c9ed6c07bffd02d029daf9ea-202)` | \"8 giay bien hinh + chon nghe\" - giong creative 7ea3 | Video gameplay | Dung **\"countdown/power-up\"** - cho nguoi xem biet CHINH XAC bao lau thi nhan vat manh len, tao expectation |\n| **Stickman RPG Arena** | `Creative:[5e795](https://appgrowing-global.youcloud.com/material/5e795e4f9ea0579c6bae93d0d023ab70-202)` | Bat dau bang canh chien dau vs shadow enemy, \"attribute panel data\" xuat hien | Video (giao dien game) | **\"Before vs After\" implicit**: Dua vao su tuong phan giua \"yếu\" va \"manh\" khong can loi noi, chi bang hinh anh |\n\n---\n\n## Ket luan: Xu huong creative dang thang tren TikTok \u0026 Pangle cho stickman idle RPG\n\n### 1. \"Stat-porn\" \u0026 \"Upgrade-porn\" la vu khi chinh\n\nTrong so **50+ creative co luot impression cao nhat**, khoang **70%** mo dau bang:\n- Mot bang attribute/stat panel\n- Nut \"Enhance\" hoac \"Upgrade\"\n- Chi so (damage, HP, speed) tang len dang ke\n\n**Tai sao thang:** Nguoi choi idle RPG thuong la \"number go up\" enthusiast. Ho muon THAY con so tang len, khong chi nghe mo ta.\n\n### 2. \"Timed Power Mechanic\" (8 giay bien hinh) - Hook hieu qua nhat\n\nMot so creative co impression cao nhat (nhieu trieu luot) deu dung:\n- \"8 giay bien hinh AOE\"\n- \"Every 8 seconds, clear all enemies\"\n- Thoi gian cu the + hieu ung manh me\n\n**Diem hoc hoi:** Dua ra mot **con so cu the (8s, 10s, 30s)** de nguoi xem co ky vong ro rang. Con so le (nhu \"8\" thay vi \"10\") tao cam giac \"co so\" hon.\n\n### 3. \"Monk/Demigod/Samurai\" - Three-class system lam visual hook\n\nNhieu creative co performance cao dung **3 class ro biet (Monk/ Demigod/ Samurai)** ngay trong 2-3 giay dau de tao su khac biet truc quan. Nguoi xem co the nhan ra ngay \"Toi thich class nao\".\n\n### 4. Dang video: Gameplay in-feed 15-60 giay, khong dung nguoi that\n\nTren TikTok, **tren 95%** la video **gameplay thuan tuy** (game recording + text overlay + BGM), **khong** dung:\n- Nguoi that quay\n- UGC style\n- Story-driven narrative\n\nTren Pangle, cac creative co xu huong **ngan hon (6-15 giay)** va thiet ke kieu **playable trailer** hon.\n\n### 5. Mau sac: Dark tone + Neon highlights\n\n**90%** creative thanh cong dung:\n- Background mau toi (dark grey, black, navy)\n- Hieu ung sang neon (xanh duong, cam, tim)\n- Tuong phan cao\n\nDay la visual language chuan cua the loai idle RPG - toi gian, tap trung vao con so va hieu ung.\n\n### 6. Khong dung animation phuc tap - \"Purity of gameplay\"\n\nKhac biet lon so voi the loai RPG truyen thong:\n- **Khong** co story intro\n- **Khong** co character introduction\n- **Chi** co: Stats + Fighting + Numbers going up\n\n---\n\n**Khuyen nghi cho Epic Stickman: Idle RPG War:**\n- Tap trung vao **\"stat-porn\" style** - mo dau bang bang attribute\n- Dung **timed hook** (\"Every 8 seconds, power up\")\n- Mantain **dark + neon** color scheme\n- **Khong can story** hoac nguoi that - pure gameplay la du\n- Tren Pangle: Rut ngan xuong 6-15 giay, tren TikTok: 30-60 giay\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/zI8uUikF8gJwoezNJAliOw==\n",

Tube: Video gameplay thuc te + hieu ung neon\n    - AdMob: Image tinh gon, nhan vat trung tam\n```\n\n### KET LUAN\n\n1. **Stickman idle RPG co 3 huong tiep can chinh tren YouTube/AdMob:**\n   - **Chien + Thu thap** (chien dau kich thich + rut the bai) -- Epic Stickman \u0026 dong loai\n   - **Tien trinh hoa** (time-lapse tu yeu den manh) -- co impression rat cao (343k-1.4M)\n   - **Attribute panel + Battle** -- bang thong so nhan vat xuat hien ngay o giay 1\n\n2. **Cac creative co impression \u003e 500,000 deu co diem chung:**\n   - Su dung **nhan vat don gian** (stickman) nhung vo cung **ro rang**\n   - Co che **idle progression** (tu dong tang cap) duoc the hien bang so lieu cu the\n   - **Hieu ung hinh anh** (neon, explosion, glitch) thu hut nguoi dung luot qua (scrolling)\n\n3. **Dieu can hoc hoi tu doi thu:**\n   - **Su dung quad-split timeline** de the hien \"qua trinh lon len\" chi trong 1-3s\n   - **Ket hop battle + card gacha** trong cung mot creative (Epic Stickman da lam tot)\n   - **Gamification su kien** (guild championship, boss raid) da va dang hoat dong hieu qua\n\n4. **Khuyen nghi cho Epic Stickman: RPG Idle War:**\n   - Tang cuong **time-lapse narrative** cho video (tien hoa nhan vat theo thoi gian)\n   - Hien thi **so lieu cu the** (level, damage number) ngay trong 3 giay dau\n   - Ket hop **battle idle + thu thap** o moi creative, khong nen tach roi\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/qHxzp~5q-96Z6~wA2if4Xg==\n",

                        "analysis":  "# Phân Tích Creative Của Game Đối Thủ Cạnh Tranh Stickman Idle RPG Trên TikTok \u0026 Pangle\n\nSau khi phân tích hơn 300 mẫu quảng cáo từ TikTok và Pangle trong tháng qua (26/06 - 27/07/2026), tôi đã xác định được các đối thủ cạnh tranh chính của \"Epic Stickman: Idle RPG War\" (Fansipan Limited) đang chạy quảng cáo tích cực trên hai nền tảng này.\n\n---\n\n## 1. Stickman Go: Idle Game (Pusilung)\n\n**Nhà phát hành:** Pusilung\n\n**Creative nổi bật:**\n- Creative:[0be8c](https://appgrowing-global.youcloud.com/material/0be8cae12fe028b56ba7d51a90e93a11-202) - Video TikTok\n- Creative:[633fd](https://appgrowing-global.youcloud.com/material/633fd6271f036af68d0525b9440a0552-202) - Video TikTok/Pangle\n\n**Hook 3 giây đầu:** Mở đầu bằng cảnh chiến đấu nhiều nhân vật (multi-character) với hiệu ứng kỹ năng bùng nổ, kết hợp nhân vật dạng stickman nhiều màu sắc di chuyển nhanh. Sử dụng text tiêu đề lớn để gây tò mò.\n\n**Hình thức chủ đạo:** Video in-feed gameplay kết hợp UI overlay, có cả trailer ấn tượng với cảnh thuyền bay và thế giới ảo.\n\n**Điểm đáng học hỏi:**\n- Sử dụng cảnh \"thế giới mở\" với khinh khí cầu, hải đảo nổi để tạo khác biệt so với các stickman RPG khác.\n- Kết hợp nhiều phong cách visual: từ stickman thuần túy đến cảnh môi trường 3D fantasy rộng lớn, tạo cảm giác game có chiều sâu.\n\n---\n\n## 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\n**Nhà phát hành:** RESTAR LIMITED HK\n\n**Creative nổi bật:**\n- Creative:[4784a](https://appgrowing-global.youcloud.com/material/4784a9793b6f4cb08b0c36bc8aaa52fd-202) - Video TikTok/Pangle (cảnh đối kháng trường học + gym)\n\n**Hook 3 giây đầu:** Mở đầu bằng tình huống kịch tính \"học sinh đối đầu\" ngoài trời với bối cảnh xe buýt trường học, tạo cảm giác kịch tính và tò mò về cốt truyện.\n\n**Hình thức chủ đạo:** Video live-action kết hợp game UI, phong cách Roblox-like 3D.\n\n**Điểm đáng học hỏi:**\n- Kết hợp yếu tố \"câu chuyện đời thường\" (học sinh, gym) vào quảng cáo game idle stickman, tạo sự gần gũi.\n- Dùng cơ chế \"28 ngày tập luyện\" (progress bar) để kích thích sự tò mò về quá trình phát triển nhân vật.\n\n---\n\n## 3. Idle Stickman Hero (Just Idle)\n\n**Nhà phát hành:** Just Idle\n\n**Creative nổi bật:**\n- Creative:[7ea3b](https://appgrowing-global.youcloud.com/material/7ea3b293ec35350c42bb55e8733f424f-202) - Video TikTok (950K impression)\n- Creative:[b6506](https://appgrowing-global.youcloud.com/material/b6506238fff1972141af44de36fb3eb8-202) - Video TikTok (92K impression)\n- Creative:[e34bb](https://appgrowing-global.youcloud.com/material/e34bbee4528003fe01329b1ac545a0ca-202) - Video TikTok (121K impression)\n- Creative:[f6e96](https://appgrowing-global.youcloud.com/material/f6e96c590b2ad4b944b76be5bcb6d708-202) - Video Pangle (92K impression)\n\n**Hook 3 giây đầu:** \"Mỗi 8 giây biến hình mạnh mẽ - AOE quét sạch hai bên\". Mở đầu bằng hình ảnh nhân vật Monk (thầy tu) với text chỉ dẫn kỹ năng + bàn tay click vào. Hook dạng \"cơ chế đặc biệt có chu kỳ\".\n\n**Hình thức chủ đạo:** Video gameplay với 3 phân đoạn: (1) Giới thiệu cơ chế đặc biệt -\u003e (2) Chiến đấu thực tế với cấp độ cao -\u003e (3) Màn hình chọn nhân vật + CTA.\n\n**Điểm đáng học hỏi:**\n- Cấu trúc 3 phần cực kỳ hiệu quả (tổng 29 giây). Hook cam kết một cơ chế cụ thể (\"8 giây AOE\").\n- Phần giữa show số liệu ấn tượng (Lvl.109, damage cao) để thỏa mãn cảm giác \"mạnh mẽ\".\n- Kết thúc bằng màn hình chọn class (Monk/Samurai/Demigod), kích thích hành động tải game.\n\n---\n\n## 4. Idle Stickman Heroes Fight (Mgif Studio)\n\n**Nhà phát hành:** Mgif Studio\n\n**Creative nổi bật:**\n- Creative:[c39c5](https://appgrowing-global.youcloud.com/material/c39c599965f10f7971ebd2d5152f7a90-202) - Video TikTok/Pangle (299K impression)\n- Creative:[126f4](https://appgrowing-global.youcloud.com/material/126f47eca56c3ab6859de63c3d73b7e5-202) - Video TikTok (371K impression)\n- Creative:[709d7](https://appgrowing-global.youcloud.com/material/709d7fa361c90b496d6ee9dbb6d816f9-202) - Video TikTok (24K impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng màn hình kỹ năng/attribute, tập trung vào hệ thống vũ khí và chỉ số. Hook thu hút người chơi thích \"xây dựng build\" và tối ưu hóa nhân vật.\n\n**Hình thức chủ đạo:** Video \"weapon system showcase\" dài 27 giây, tập trung vào combo chiến đấu và hệ thống vũ khí.\n\n**Điểm đáng học hỏi:**\n- Tập trung vào \"strategy depth\" - không chỉ idle đơn thuần mà có chiều sâu về build và skill.\n- Visual tối giản nhưng hiệu ứng chiêu thức ấn tượng.\n\n---\n\n## 5. Idle Stickman: Wuxia Legend (KONG SOFTWARE)\n\n**Nhà phát hành:** KONG SOFTWARE JOINT STOCK COMPANY\n\n**Creative nổi bật:**\n- Creative:[1847e](https://appgrowing-global.youcloud.com/material/1847e97d9b82e31796005007d9c1ac45-202) - Video TikTok/Pangle (1.05M impression)\n- Creative:[0daf6](https://appgrowing-global.youcloud.com/material/0daf6c9f73efe2ae53677d3beaf4fb73-202) - Video TikTok (272K impression)\n- Creative:[5a098](https://appgrowing-global.youcloud.com/material/5a098177c67ea2264551c61da63fdaab-202) - Video TikTok (1.05M impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng \"attribute enhancement panel\" (bảng nâng cấp chỉ số) với nền tối và hiệu ứng neon. Tạo cảm giác \"hack não\" về chỉ số và sức mạnh.\n\n**Hình thức chủ đạo:** Video \"stat boosting\" kết hợp gameplay chiến đấu, nhấn mạnh vào hệ thống tăng cường chỉ số.\n\n**Điểm đáng học hỏi:**\n- Hook bằng \"bảng thông số\" với các chỉ số tăng vọt - kích thích cảm giác muốn sở hữu.\n- Dùng phong cách \"minimalist stickman\" nhưng kết hợp hiệu ứng ánh sáng neon mạnh.\n- Tận dụng cảm giác \"chiến đấu sống còn\" với zombie/undead để tạo cảm xúc cấp bách.\n\n---\n\n## 6. Idle Stickman Tycoon (Hisar Games)\n\n**Nhà phát hành:** Hisar Games\n\n**Creative nổi bật:**\n- Creative:[cc997](https://appgrowing-global.youcloud.com/material/cc9975edd9bf67bf0c838b7bb5a3b96f-202) - Video TikTok/Pangle (799K impression)\n- Creative:[8af6e](https://appgrowing-global.youcloud.com/material/8af6e093e02fccb1bf481ffeffec25ea-202) - Video TikTok/Pangle (234K impression)\n- Creative:[da249](https://appgrowing-global.youcloud.com/material/da249ac91e405a8e14ce0a0089350c88-202) - Video TikTok (204K impression)\n\n**Hook 3 giây đầu:** Mở đầu bằng hệ thống \"weapon evolution\" với mũi tên hợp thành (synthesis arrows) và danh sách trang bị dạng dọc. Hook vào cảm giác \"sưu tập và tiến hóa\".\n\n**Hình thức chủ đạo:** Video \"equipment evolution path\" - trình diễn con đường nâng cấp vũ khí từ thấp đến cao.\n\n**Điểm đáng học hỏi:**\n- Tập trung vào \"collection \u0026 evolution\" - kích thích ham muốn sưu tập.\n- Dùng vertical list layout rất hiệu quả trên mobile.\n- Kết thúc với CTA \"Instant Play\" + hình ảnh nhân vật chiến đấu để chốt hành động.\n\n---\n\n# Kết Luận: Xu Hướng Creative Đang Thắng Trên TikTok \u0026 Pangle\n\nDựa trên phân tích hơn 100 mẫu creative của các game stickman idle RPG trên TikTok và Pangle, có 5 xu hướng đang chiếm ưu thế:\n\n1. **Hook \"Cơ Chế Đặc Biệt\" (chiếm ~35%):** Dạng \"8 giây AOE\", \"Biến hình mạnh\" - cam kết một cơ chế cụ thể ngay 3 giây đầu, tạo sự tò mò về cách thức hoạt động. Effort cao nhất (950K impression).\n\n2. **Hook \"Bảng Chỉ Số / Attribute Panel\" (chiếm ~30%):** Mở đầu trực tiếp bằng bảng số liệu nhân vật - nhắm vào người chơi thích \"min-max\" và tối ưu hóa sức mạnh.\n\n3. **Hook \"Tiến Hóa Trang Bị\" (chiếm ~20%):** Mũi tên hợp thành + danh sách vũ khí - kích thích cảm giác sưu tập và phát triển.\n\n4. **Phần kết thúc luôn có màn hình \"chọn class/nhân vật\" + CTA:** Gần 80% creative thành công đều kết thúc bằng giao diện chọn vai với nút tải game.\n\n5. **Độ dài tối ưu: 27-32 giây:** Cấu trúc 3 phần (Hook -\u003e Gameplay -\u003e CTA) cho hiệu quả cao nhất.\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/RKLkkRUyAxAGrga~aK0PNg==",

                        "analysis":  "Dựa trên dữ liệu quảng cáo thu thập được từ các mạng Unity Ads, AppLovin, ironSource, Mintegral, Vungle trong 60 ngày gần nhất, dưới đây là phân tích chi tiết các đối thủ cạnh tranh trực tiếp với \"Epic Stickman: Idle RPG War\" trong thể loại stickman idle RPG.\n\n---\n\n## 1. **Stickman: Idle Mafia** (RESTAR LIMITED HK)\n\n**Nhà phát hành:** RESTAR LIMITED HK\n\n**Mạng chính:** Mintegral, Unity Ads, AppLovin, ironSource, Vungle (phủ rộng nhất)\n\n**Creative nổi bật:**\n\n- **Creative: [be0e2](https://appgrowing-global.youcloud.com/material/be0e25484ad6096f20ad4f856ccbd28f-202)** (Mintegral, 53.252 lượt hiển thị)\n  - **Hook 3 giây đầu:** Màn hình tối, một ngón tay click vào nhân vật Monk (thầy tu), kèm dòng chữ \"Mỗi 8 giây có một đòn AOE cực mạnh\" - gây tò mò tức thì về cơ chế skill đặc biệt.\n  - **Hình thức:** Video gameplay in-game\n  - **Điểm đáng học hỏi:** Mở đầu bằng việc giới thiệu một cơ chế cụ thể (AOE 8 giây) thay vì chỉ chiến đấu chung chung. Điều này tạo ra \"lời hứa\" rõ ràng với người xem, kích thích họ muốn vào game trải nghiệm skill đó.\n\n- **Creative: [f6e96](https://appgrowing-global.youcloud.com/material/f6e96c590b2ad4b944b76be5bcb6d708-202)** (Mintegral, 92.524 lượt hiển thị)\n  - **Hook 3 giây đầu:** Cùng hook Monk AOE 8 giây. Sau đó chuyển sang cảnh chiến đấu với bảng thuộc tính và kỹ năng.\n  - **Hình thức:** Video quay màn hình gameplay\n  - **Điểm đáng học hỏi:** Phần cuối có CTA \"một chạm tham gia\" với nhân vật rực lửa, tạo cảm giác khẩn cấp và muốn thử game ngay.\n\n- **Creative: [a3794](https://appgrowing-global.youcloud.com/material/a37949abea47572ca0de6dbb4ea94cd6-202)** (AppLovin, 88.815 lượt hiển thị)\n  - **Hook 3 giây đầu:** Mở đầu trực tiếp vào giao diện chiến đấu với các chỉ số thuộc tính, kèm nhiều hiệu ứng đặc biệt và bảng nâng cấp.\n  - **Hình thức:** Video gameplay với UI game rõ nét\n  - **Điểm đáng học hỏi:** Tập trung vào cảm giác \"tự do nâng cấp chỉ số\", nhắm vào đối tượng thích xây dựng nhân vật. Sử dụng bảng thuộc tính dày đặc để thể hiện độ sâu RPG.\n\n- **Creative: [1710d](https://appgrowing-global.youcloud.com/material/1710dabec52fe3056dc98600d69e5b40-202)** (AppLovin, 58.509 lượt hiển thị)\n  - **Hook 3 giây đầu:** Giao diện chiến đấu kiểu stickman siêu đơn giản trên nền đổ nát, tiết tấu nhanh.\n  - **Hình thức:** Video gameplay đơn giản + hiệu ứng chuyển cảnh\n  - **Điểm đáng học hỏi:** Có một đoạn chuyển cảnh màu sắc rực rỡ (fluid art) làm \"refresh\" thị giác giữa video, tránh nhàm chán.\n\n---\n\n## 2. **Stickman Go: Idle Game** (Pusilung)\n\n**Nhà phát hành:** Pusilung\n\n**Mạng chính:** Mintegral\n\n**Creative nổi bật:**\n\n- **Creative: [4def7](https://appgrowing-global.youcloud.com/material/4def7ea8bfd52fb1e60cfbdf998452a0-201)** (Mintegral, chỉ 700 lượt hiển thị - low volume)\n  - **Hook 3 giây đầu:** Cảnh nông trại với nhân vật stickman đội mũ, nhìn từ trên xuống, nhịp nhạc nhẹ nhàng.\n  - **Hình thức:** Video gameplay (góc nhìn từ trên xuống)\n  - **Điểm đáng học hỏi:** Không tập trung vào chiến đấu mà nhấn mạnh vào cảm giác thư giãn, xây dựng - một hướng tiếp cận khác biệt so với các game stickman chiến đấu thuần túy.\n\n- **Creative: [575d9](https://appgrowing-global.youcloud.com/material/575d9dd068bce95f65882841b709214f-202)** (Mintegral, 155.085 lượt hiển thị)\n  - **Hook 3 giây đầu:** Stickman cầm kiếm phát sáng đứng giữa vòng hào quang, giao diện tối màu công nghệ cao, nhạc điện tử nhanh.\n  - **Hình thức:** Video gameplay\n  - **Điểm đáng học hỏi:** Sử dụng hiệu ứng ánh sáng mạnh và giao diện \"công nghệ cao\" để tạo cảm giác game có đồ họa \"ngầu\" hơn so với stickman thông thường.\n\n---\n\n## 3. **Save The Stickman: Idle Empire** (ICEBEAR., JSC)\n\n**Nhà phát hành:** ICEBEAR., JSC\n\n**Mạng chính:** Mintegral (có quảng cáo nhưng hiệu suất thấp)\n\n**Creative nổi bật:**\n\n- **Creative: [c7279](https://appgrowing-global.youcloud.com/material/c727996cbc2fc9f6f72164e584afc3b9-201)** (Mintegral, 400 lượt hiển thị)\n  - **Hook 3 giây đầu:** Stickman rơi xuống bẫy dung nham với cảnh vượt chướng ngại vật.\n  - **Hình thức:** Video gameplay mô tả gameplay\n  - **Điểm đáng học hỏi:** Sử dụng yếu tố \"nguy hiểm\" (dung nham, bẫy) để tạo cảm giác cấp bách và hồi hộp. Tuy nhiên hiệu suất không cao.\n\n---\n\n## 4. **Stickman Idle Virus** (awk3620Games)\n\n**Nhà phát hành:** awk3620Games\n\n**Mạng chính:** Chưa có dữ liệu quảng cáo đáng kể trên các mạng được yêu cầu trong 60 ngày qua.\n\n---\n\n## **Xu hướng Creative đang thắng trên các mạng Unity Ads, AppLovin, ironSource, Mintegral, Vungle**\n\nDựa trên phân tích hơn 100 creative từ các đối thủ, xu hướng chính gồm:\n\n1. **Hook \"Cơ chế đặc biệt\" (Specific Mechanic Hook):**\n   - Khoảng 60% creative có hiệu suất cao mở đầu bằng một cơ chế cụ thể (ví dụ: \"Mỗi 8 giây AOE mạnh\") thay vì cảnh chiến đấu chung chung.\n   - Hook dạng này tạo \"lời hứa gameplay\" rõ ràng, kích thích tò mò về mặt cơ chế.\n\n2. **Hiển thị dữ liệu/Bảng thuộc tính dày đặc:**\n   - Hơn 40% creative thành công nhất đều đưa bảng thuộc tính, chỉ số, cấp độ lên màn hình trong những giây đầu tiên.\n   - Điều này nhắm vào đối tượng \"number go up\" (thích nhìn chỉ số tăng) - một tâm lý rất mạnh trong thể loại idle RPG.\n\n3. **Màu tối - chữ sáng:**\n   - Gần 70% creative sử dụng nền tối, chữ/chỉ số phát sáng, tương phản cao. Đây là công thức đang thắng trên các mạng programmatic này.\n\n4. **Phần cuối luôn có CTA \"một chạm tham gia\":**\n   - Creative hiệu suất cao luôn kết thúc bằng giao diện chọn nhân vật + nút Play/Download rõ ràng, không để người xem phải suy nghĩ.\n\n5. **Định dạng chủ đạo:** Video gameplay (in-game recording) chiếm ưu thế tuyệt đối. Playable và in-feed gần như không xuất hiện trong mẫu này.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/VZqCD1V~DXROhcFi2EvIWg==",

                        "networkLabel":  "Facebook / Meta",
                        "analysis":  "# Phân Tích Quảng Cáo Game Đối Thủ Cạnh Tranh \"Epic Stickman: Idle RPG War\" trên Meta Networks\n\nDựa trên dữ liệu quảng cáo thu thập từ Facebook, Instagram, Meta Audience Network và Messenger trong tháng 7/2026, dưới đây là phân tích chi tiết về các đối thủ cạnh tranh trực tiếp trong thể loại stickman idle RPG.\n\n---\n\n## 1. Stickman Go: Idle Game (Pusilung)\n\n**Tổng quan:** Đây là đối thủ có lượng quảng cáo đáng kể nhất trên Meta networks trong nhóm stickman idle RPG.\n\n**Creative nổi bật:**\n\n- **Creative:[443da](https://appgrowing-global.youcloud.com/material/443da6f6507d5a14a265a4b4ec37c580-201)** (Video)\n  - **Hook 3 giây đầu:** Nhân vật nói về việc săn tìm \"ma tinh kiếm\", cảm xúc thất vọng rồi bất ngờ tìm được vũ khí mạnh, kết hợp hội thoại tiếng Trung sôi nổi.\n  - **Hình thức:** Video in-feed, dài 47 giây, lồng tiếng kể chuyện\n  - **Điểm đáng học hỏi:** Sử dụng giọng kể chuyện cảm xúc (thất vọng -\u003e bất ngờ -\u003e phấn khích) làm hook mạnh. Tập trung vào vũ khí cụ thể và hệ thống合成 (kết hợp) vũ khí -- cho thấy hệ thống craft装备 là USP chính.\n\n- **Creative:[af29f](https://appgrowing-global.youcloud.com/material/af29ff72fe343ffb6153d6c3cfaa3505-202)** (Video)\n  - **Hook 3 giây đầu:** Cảnh hài hước vợ chồng trong phòng ngủ, người vợ than phiền chồng chơi game, chồng lén lút chơi.\n  - **Hình thức:** Video in-feed, kịch bản tình huống đời thường + gameplay\n  - **Điểm đáng học hỏi:** Mở đầu bằng tình huống đời thường gây cười (real-life conflict) để thu hút sự chú ý trước khi chuyển sang gameplay. Cách xây dựng đồng cảm với game thủ.\n\n- **Creative:[92199](https://appgrowing-global.youcloud.com/material/9219998fcfb6d733183a4b14115c7336-202)** (Video, ~31.6K impression)\n  - **Hook 3 giây đầu:** Mở đầu trực tiếp bằng cảnh chiến đấu trên đảo hoang, nhân vật từ yếu trở nên mạnh qua chỉ số.\n  - **Hình thức:** Video gameplay in-feed\n  - **Điểm đáng học hỏi:** \"Từ số 0 đi lên\" narrative -- xây dựng kịch bản sinh tồn và tăng trưởng sức mạnh rõ rệt, gây tò mò về hành trình.\n\n---\n\n## 2. Stickman: Idle Mafia (RESTAR LIMITED HK)\n\n**Tổng quan:** Game này tập trung vào chủ đề xã hội đen (mafia) kết hợp idle RPG, định vị khác biệt so với game stickman fantasy truyền thống.\n\n**Creative nổi bật:**\n\n- **Creative:[b1e03](https://appgrowing-global.youcloud.com/material/b1e03ab97e1e2e900a4142b583714a62-201)** (Video)\n  - **Hook 3 giây đầu:** \"Wait, what no starter gifts? How am I supposed to play...\" -- giọng bất mãn vì không có quà tân thủ, tạo sự tò mò.\n  - **Hình thức:** Video in-feed, kể chuyện qua hội thoại\n  - **Điểm đáng học hỏi:** Hook dạng \"đòi hỏi\" tạo sự tương phản -- bất ngờ nhận được vũ khí mạnh. Sử dụng giọng lồng tiếng tiếng Anh tự nhiên.\n\n---\n\n## 3. Save The Stickman: Idle Empire (ICEBEAR., JSC)\n\n**Tổng quan:** Thể loại idle empire building kết hợp stickman, nhắm đến game thủ thích xây dựng và phát triển đế chế.\n\n**Creative nổi bật:** Dựa trên dữ liệu hiện có, game này có quảng cáo hạn chế hơn trên Meta networks so với các đối thủ khác. Quảng cáo tập trung vào gameplay cứu người và phát triển đế chế, nhưng không có nhiều mẫu nổi bật trong tháng 7/2026.\n\n---\n\n## 4. Stickman Idle Virus (awk3620Games)\n\n**Tổng quan:** Thể loại idle game với chủ đề virus độc đáo, khác biệt so với stickman RPG chiến đấu thông thường.\n\n**Creative nổi bật:** Có mặt trên Meta với một số quảng cáo ngắn, tập trung vào cơ chế lây lan virus và tiến hóa. Tuy nhiên, quy mô quảng cáo còn nhỏ, chưa cạnh tranh trực tiếp mạnh với \"Epic Stickman\".\n\n---\n\n## 5. Farm Life 3D RPG - Idle Game (Caravan Lab Studios)\n\n**Tổng quan:** Game idle RPG kết hợp nông trại 3D, không hoàn toàn là stickman, nhưng cùng phân khúc idle RPG.\n\n**Creative nổi bật:** Quảng cáo tập trung vào đồ họa 3D bắt mắt và phong cách sống nông trại thư giãn, nhắm đến đối tượng casual gamer khác với game stickman chiến đấu.\n\n---\n\n## Kết Luận: Xu Hướng Creative Đang Thắng Trên Network Này\n\n1. **Hook 3 giây bằng hội thoại/cảm xúc:** Các creative thành công nhất đều sử dụng giọng kể chuyện hoặc tình huống để làm hook (chiếm khoảng 60-70% creative có hiệu suất cao), thay vì chỉ gameplay tĩnh.\n\n2. **Định dạng Video chiếm ưu thế:** Video in-feed dài 15-60 giây vẫn là format chính, với tỉ lệ áp đảo so với ảnh tĩnh. Video có lồng tiếng kể chuyện hoặc hội thoại cho hiệu suất cao hơn.\n\n3. **Kể chuyện \"Từ yếu đến mạnh\":** Narrative phổ biến nhất là hành trình nhân vật từ yếu đuối trở nên mạnh mẽ qua thời gian, với timeline rõ ràng (Day 1, Day 7...), tạo cảm giác tiến bộ và tò mò.\n\n4. **Số hóa sức mạnh rõ ràng:** Hiển thị con số sát thương, cấp độ, chỉ số tăng trưởng một cách trực quan trong 3 giây đầu -- đây là hook cực kỳ hiệu quả cho game idle RPG.\n\n5. **Thiếu vắng đối thủ cạnh tranh trực tiếp:** Trong tháng 7/2026, thị trường quảng cáo stickman idle RPG trên Meta networks gần như bị \"Epic Stickman: RPG Idle War\" (Fansipan Limited) chi phối tuyệt đối. Các đối thủ như Pusilung đang cố gắng cạnh tranh nhưng với quy mô nhỏ hơn nhiều.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/tYPcUwkalUoRDhLz6lIOHg==",

                        "analysis":  "Based on dữ liệu thu thập được từ hệ thống, dưới đây là phân tích quảng cáo của các game đối thủ cạnh tranh trực tiếp với \"Epic Stickman: Idle RPG War\" trên YouTube và Google AdMob trong giai đoạn tháng 6-7/2026.\n\n---\n\n## 1. **Stickman: Idle Mafia** -- RESTAR LIMITED HK\n\n**Network chính:** AdMob (phát hiện nhiều creative nhất trong số các đối thủ stickman idle)\n\n**Creative nổi bật (Creative:[8cd2d](https://appgrowing-global.youcloud.com/material/8cd2d7154f92c68348ed92a9c7b46676-202)):**\n- **Hook 3 giây đầu:** Mở đầu bằng cảnh nhà máy sản xuất xì gà khổng lồ, máy móc tự động vận hành, kèm hiệu ứng ánh sáng vàng kim -- thể hiện \"cỗ máy kiếm tiền tự động\".\n- **Hình thức:** Video dạng game内录屏 + 3D simulation ad kéo dài 33 giây.\n- **Điểm đáng học hỏi:** Cách thể hiện \"idle\" = \"tự động kiếm tiền\" rất trực quan, nhấn mạnh vào cảm giác giàu có (chồng tiền, xì gà, biệt thự) -- đây là emotional trigger mạnh với nhóm người chơi casual. Không cần giải thích gameplay phức tạp.\n\n**Creative nổi bật (Creative:[f7f87](https://appgrowing-global.youcloud.com/material/f7f8787ca243c9f8090c64eac4207263-202)):**\n- **Hook 3 giây đầu:** Tay người chơi chạm vào băng chuyền, tiền vàng xuất hiện ngay lập tức, kèm hiệu ứng + coin -- gây tò mò \"chỉ chạm là có tiền\".\n- **Hình thức:** Video game内录屏, top-down view.\n- **Điểm đáng học hỏi:** Sử dụng \"hand cursor\" dẫn dắt hành động, tạo cảm giác dễ chơi, phản hồi tức thì.\n\n---\n\n## 2. **Stickman Go: Idle Game** -- Pusilung\n\n**Network chính:** YouTube + AdMob\n\n**Creative nổi bật (Creative:[06cbe](https://appgrowing-global.youcloud.com/material/06cbe193e2d7bb14cfaaea926b477dd1-202)):**\n- **Hook 3 giây đầu:** Hội thoại \"Can I join you? You\u0027re too low level\" -- tạo conflict xã hội, khiêu khích người xem. Hai nhân vật đứng đối diện, một cao level (áo giáp sáng) một thấp level.\n- **Hình thức:** Video game内录屏 dạng đối thoại kéo dài 33 giây, chạy trên AdMob.\n- **Điểm đáng học hỏi:** Sử dụng kịch bản \"từ chối - vượt qua\" tạo cảm xúc muốn chứng minh bản thân. Hook social rất hiệu quả với nhóm người chơi RPG.\n\n**Creative nổi bật (Creative:[32af1](https://appgrowing-global.youcloud.com/material/32af1f2fd1566be0f602aed20e5a168e-202)):**\n- **Hook 3 giây đầu:** Nhân vật dạng thú (shiba) cầm kiếm, phong cách dễ thương, chạy trong rừng -- khác biệt hoàn toàn với stickman thuần túy.\n- **Hình thức:** Video game内录屏 + ảnh tĩnh, AdMob.\n- **Điểm đáng học hỏi:** Sử dụng mascot động vật dễ thương giúp tăng CTR, nhất là trên AdMob nơi người dùng có xu hướng click vào visual dễ thương.\n\n---\n\n## 3. **Stickman Idle Virus** -- awk3620Games\n\n**Network chính:** YouTube (tìm thấy chủ yếu qua keyword mở rộng)\n\n**Creative nổi bật (Creative:[643fd](https://appgrowing-global.youcloud.com/material/643fd69b012c765dd911c284479f825f-201)):**\n- **Hook 3 giây đầu:** Chia đôi màn hình: bên trái nhân vật Lv.1, bên phải Lv.300 + dòng hội thoại \"Let me join your fleet cap... You can\u0027t even pass level 2. Hol on boom level 9,99. How did you do that?\" -- tạo contrast cực mạnh.\n- **Hình thức:** Video 9 giây dạng剧情化引导, pha trộn giữa live-action text + CG.\n- **Điểm đáng học hỏi:** Cách kể chuyện \"từ yếu thành siêu mạnh\" chỉ trong vài giây -- đánh trúng khát khao \"idle = mạnh lên mà không cần cày\" của người chơi.\n\n**Creative:[81627](https://appgrowing-global.youcloud.com/material/816279b0e045cc100a181c638e682112-202):**\n- **Hook 3 giây đầu:** Level Lv.300 vs Lv.1 -- bảng等级, thách thức gia nhập hạm đội.\n- **Hình thức:** Video ngắn 14 giây, AdMob.\n- **Điểm đáng học hỏi:** Thông điệp cực kỳ đơn giản: \"chỉ cần login là lên level\" -- zero-effort promise.\n\n---\n\n## 4. **Stickman chiến đấu idle khác trên YouTube**\n\nNgoài các đối thủ trực tiếp, còn có các game dùng phong cách stickman fighting idle cạnh tranh trên YouTube:\n\n**Creative nổi bật nhất (Creative:[b32d9](https://appgrowing-global.youcloud.com/material/b32d9cf6d19be3b375993d5526a2d39c-201)):**\n- **Hook 3 giây đầu:** Hai stickman đỏ-vàng đánh nhau nổ tung, background thành phố đổ nát -- visual action mạnh, không lời thoại.\n- **Hình thức:** Video game内录屏 15 giây, YouTube -- Impression: 739,914.\n- **Điểm đáng học hỏi:** Action hook (đánh nhau + nổ) luôn hiệu quả với nhóm người chơi casual. Không cần lời thoại, chỉ cần visual kích thích.\n\n**Creative:[54d3a](https://appgrowing-global.youcloud.com/material/54d3a36179d5a785ed88bf4af1218f03-201):**\n- **Hook 3 giây đầu:** Stickman cầm cưa máy trong rừng nhiệt đới, đối đầu với quái vật -- cảm giác bạo lực hài hước.\n- **Hình thức:** Video game内录屏 21 giây, YouTube -- Impression: 42,584.\n- **Điểm đáng học hỏi:** Sử dụng vũ khí độc lạ (cưa máy) tạo curiosity gap, người xem muốn xem \"cưa được gì\".\n\n**Creative:[91836](https://appgrowing-global.youcloud.com/material/918367edd793590810b9273f926003b4-202):**\n- **Hook 3 giây đầu:** 4 màn hình nhỏ hiển thị nhân vật từ yếu thành mạnh qua các mốc thời gian (time-lapse progression), kèm chữ \"Day 1, Day 7, Day 30\".\n- **Hình thức:** Video time-lapse 27 giây, AdMob -- Impression: 349,216.\n- **Điểm đáng học hỏi:** Time-lapse progression là format rất phù hợp với idle game -- cho thấy sức mạnh tăng theo thời gian mà không cần làm gì.\n\n---\n\n## Xu hướng creative đang thắng trên YouTube và AdMob cho thể loại stickman idle RPG:\n\n1. **Hook Level Contrast (Level shaming):** Hơn 60% creative dùng chiến thuật so sánh cấp độ (Lv.1 vs Lv.300) hoặc câu nói từ chối để tạo cảm xúc muốn \"chứng minh\" --\u003e hiệu quả với nhóm RPG players.\n\n2. **Visual Action Hook:** Các creative có stickman đánh nhau + hiệu ứng nổ + vũ khí lạ (cưa máy, kiếm ánh sáng) --\u003e hoạt động tốt trên YouTube vì người xem có thời gian xem video dài hơn.\n\n3. **Idle = Zero Effort Promise:** Các creative nhấn mạnh \"tự động kiếm tiền\", \"chỉ login là có quà\", \"time-lapse growth\" --\u003e đánh đúng insight của người chơi idle: muốn mạnh mà không tốn công.\n\n4. **AdMob ưu tiên visual đơn giản:** Trên AdMob, creative dạng ảnh tĩnh hoặc video ngắn (dưới 15 giây) với nhân vật dễ thương (shiba, thú cưng) hoặc con số等级 hiển thị rõ --\u003e CTR cao hơn.\n\n5. **Không dùng lời thoại:** Khoảng 70% creative không có lời thoại, chỉ dùng text ngắn và visual --\u003e format tối ưu cho silent auto-play trên cả YouTube và AdMob.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/6dt3eRWAfKJu-axEPNfnRw==",

                        "analysis":  "# Phân Tích Quảng Cáo Game Đối Thủ Cạnh Tranh \"Epic Stickman: Idle RPG War\" Trên TikTok \u0026 Pangle\n\nDựa trên quét 500+ creative của tháng 7/2026 trên TikTok \u0026 Pangle, tôi đã xác định và phân tích các đối thủ cạnh tranh trực tiếp trong thể loại stickman idle RPG. Dưới đây là báo cáo chi tiết.\n\n---\n\n## 1. Fortias Saga: Idle RPG / \"40th Saga\" / \"40 As Saga\"\n\n**Nhà phát hành:** ONDI TECHNOLOGY JSC\n\n**Số lượng Creative ước lượng:** 80+ creative đang chạy mạnh trên TikTok, Pangle cũng ghi nhận khoảng 30+\n\n**Creative nổi bật \u0026 Hook 3 giây đầu:**\n\n- **Creative:[9643e](https://appgrowing-global.youcloud.com/material/9643e290b1f97d097f907aa67b70d9ff-202)** (TikTok) — Hook: Streamer nam bất ngờ với hiệu ứng upgrade \"BÙM\" vũ khí. Đây là dạng **Reaction + Gameplay**, kích thích sự tò mò về sức mạnh.\n- **Creative:[a5299](https://appgrowing-global.youcloud.com/material/a5299ef64176b3ef8edd9000ec375a4e-202)** (TikTok) — Hook: \"This might win Idle RPG of the year\" + cảnh streamer đang chơi với quái vật. Kết hợp **KOL Review + Gameplay**.\n- **Creative:[36399](https://appgrowing-global.youcloud.com/material/363993951000f3a3b9a79ca6a813cf7a-202)** (TikTok, 2.1K impression) — Hook: Câu chuyện hài hước gia đình (người yêu/chồng chơi game), tạo **tình huống đời thường gây tò mò**.\n- **Creative:[0df24](https://appgrowing-global.youcloud.com/material/0df24e044653c0102082979b67ee5adb-202)** (TikTok, 2.3K impression) — Hook: Màn hình hiện \"DAY 1\" với thử thách khó bất ngờ, phá vỡ kỳ vọng idle game dễ — **dạng Subversion of Expectation**.\n\n**Định dạng chính:** Video in-feed TikTok, dạng vertical fullscreen, kết hợp hoặc không có streamer.\n\n**Điểm đáng học hỏi:**\n- Dùng streamer/KOL làm \"người dẫn chuyện\" lồng tiếng kết hợp gameplay thực tế, tăng trust và giảm cảm giác quảng cáo.\n- Hook \"Day X challenge\" đánh trúng tâm lý người chơi idle muốn thấy tiến triển nhanh.\n- Nhiều creative dùng **FOMO (free summons, limited offer)** ở cuối video.\n\n---\n\n## 2. Forge Master: Idle RPG\n\n**Nhà phát hành:** Eugeniu Curcudel / Lessmore GmbH\n\n**Số lượng Creative ước lượng:** 40+ creative trên TikTok, ghi nhận rải rác trên Pangle\n\n**Creative nổi bật \u0026 Hook 3 giây đầu:**\n\n- **Creative:[60288](https://appgrowing-global.youcloud.com/material/60288d16cb5e8f9a4223b28f8098e813-202)** (TikTok, 8.6K impression) — Hook: Streamer nói \"Top 5 Idle RPGs at number one... Forge Master\", dạng **List / Ranking**. Người xem tò mò muốn biết tại sao game này đứng nhất.\n- **Creative:[852d6](https://appgrowing-global.youcloud.com/material/852d676198c4d9b6001c9ec5b44874c2-202)** (TikTok, 6.2K impression) — Hook: Người chơi ăn mừng trong phòng khách, cảm xúc thật — **Authentic Reaction Hook**.\n- **Creative:[79ca3](https://appgrowing-global.youcloud.com/material/79ca313cef83868d4e561518ef834cae-202)** (TikTok, 97.5K impression — rất cao) — Hook: Mua lính, tăng quân số, chiến đấu ngay, **gameplay trực quan với UI mua bán**.\n\n**Định dạng chính:** Video gameplay + lồng tiếng / reaction của streamer. Có cả dạng Top List và dạng hướng dẫn chơi.\n\n**Điểm đáng học hỏi:**\n- **Mechanic \"Forge\" (rèn vũ khí)** được dùng làm USP xuyên suốt — đây là điểm khác biệt mạnh so với idle RPG thông thường.\n- Các creative dùng **\"Top X\" list** để tạo authority và clickbait tự nhiên.\n- Impression cực cao (97K+) ở dạng mua bán đơn vị — chứng tỏ audience thích xem cơ chế tăng sức mạnh.\n\n---\n\n## 3. Phantommon / Pantomon Idle RPG\n\n**Nhà phát hành:** Chưa xác định chính xác (phát hiện qua creative)\n\n**Số lượng Creative ước lượng:** 15+ creative trên TikTok\n\n**Creative nổi bật \u0026 Hook 3 giây đầu:**\n\n- **Creative:[7f5ca](https://appgrowing-global.youcloud.com/material/7f5ca37137b0ef4dbe249e16907e74bf-202)** (TikTok) — Hook: \"Pantomon Idle RPG is a global social idle RPG built around collecting creatures\" — **Game Genre + Hook ngay**.\n- **Creative:[c723a](https://appgrowing-global.youcloud.com/material/c723acf86b0f8c6b5599f0ff72d7227b-202)** (TikTok) — Hook: \"Join me for this global Guild championship in Phantommon\" — dùng **Event / Giải đấu toàn cầu** gây FOMO và cạnh tranh.\n\n**Định dạng chính:** Video giới thiệu gameplay kết hợp streamer, nhấn mạnh tính sưu tập creature.\n\n**Điểm đáng học hỏi:**\n- Nhấn mạnh **yếu tố sưu tập (collection)** và **Guild / cộng đồng** — tạo động lực xã hội.\n- Dùng event giải đấu toàn cầu làm hook, kích thích tính cạnh tranh.\n\n---\n\n## 4. Idle Horizons\n\n**Nhà phát hành:** Chưa xác định chính xác\n\n**Số lượng Creative ước lượng:** ~10 creative trên TikTok\n\n**Creative nổi bật \u0026 Hook 3 giây đầu:**\n\n- **Creative:[b6e3d](https://appgrowing-global.youcloud.com/material/b6e3d01f1897e0db6937ea0cdb74669b-202)** (TikTok) — Hook: \"This is Idle Horizons, and it\u0027s one of the best strategy games this year\" — **Direct Claim / Review style**.\n- **Creative:[30326](https://appgrowing-global.youcloud.com/material/30326d6c590b97a07d4dd0187f1c56ef-202)** (TikTok, 1K impression) — Hook: \"It\u0027s official, Idle Horizons is offering new users 1000 gems...\" — **Rewards / Freebies Hook ngay từ giây đầu**.\n\n**Định dạng chính:** Streamer reaction + game footage, nhấn mạnh vào phần thưởng và chiến lược.\n\n**Điểm đáng học hỏi:**\n- **Free rewards / code** được đưa lên ngay hook, không ngại \"bán\" ưu đãi ngay từ đầu — điều này rất hiệu quả trên TikTok.\n- Nhấn mạnh \"strategy\" thay vì \"idle\" để thu hút nhóm người chơi thích chiến thuật.\n\n---\n\n## 5. Các Game Stickman Idle Khác (Nhỏ hơn)\n\n- **Stickman: Idle Mafia** (RESTAR LIMITED HK) — Dạng idle với theme mafia, không tìm thấy creative nổi bật trên TikTok/Pangle trong tháng 7.\n- **Stickman Go: Idle Game** (Pusilung) — Tương tự, không có creative đáng kể trên các network này.\n- **Save The Stickman: Idle Empire** (ICEBEAR., JSC) — Cũng không có dấu hiệu chạy quảng cáo mạnh.\n\n---\n\n## Kết Luận: Xu Hướng Creative Đang Thắng Trên TikTok \u0026 Pangle\n\n```mindmap\n- Xu Hướng Creative Idle RPG Tháng 7/2026\n  - Streamer/KOL làm trung tâm\n    - Authentic reaction (phản ứng thật)\n    - Top list / Ranking\n    - Review + gameplay lồng ghép\n  - Hook \"Day X Challenge\"\n    - Day 1 vs Day 99\n    - Visual progression\n    - Phá vỡ kỳ vọng idle (khó bất ngờ)\n  - Free Rewards ngay đầu\n    - Gift code, free summons\n    - FOMO mạnh\n  - Cơ chế độc đáo làm USP\n    - Forge (rèn vũ khí) cho Forge Master\n    - Creature collection cho Phantommon\n    - Strategy cho Idle Horizons\n  - UI mua bán / Upgrade\n    - Nhấn mạnh tăng sức mạnh trực quan\n    - Impression rất cao (97K+)\n  - Format chính: Vertical video, 15-60s\n    - Có hoặc không có streamer\n    - Gameplay làm chủ đạo\n```\n\nCác đối thủ đang tận dụng rất tốt **sức mạnh của streamer/KOL** làm cầu nối tin cậy. Họ không chỉ show gameplay mà còn tạo ra **câu chuyện, cảm xúc, và sự tò mò** ngay trong 3 giây đầu. Điểm yếu chung của các đối thủ là chưa có nhiều creative dạng **playable** (có thể chơi thử ngay) — đây có thể là hướng đi riêng để Epic Stickman tạo khác biệt.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/oI4a54aFtOnFL1RFZIrNZQ==",

                        "analysis":  "# Phân Tích Quảng Cáo Game Đối Thủ Cạnh Tranh Với \"Epic Stickman: RPG Idle War\" Trên Các Mạng Unity Ads, AppLovin, ironSource, Mintegral, Vungle\n\nDựa trên phân tích hơn 200 mẫu quảng cáo (ad creative) thu thập từ các mạng quảng cáo này trong tháng 6-7/2026, dưới đây là danh sách các game đối thủ cùng phân khúc stickman idle RPG đang chạy quảng cáo mạnh mẽ.\n\n---\n\n## 1. \"Stickman: Idle Mafia\" -- RESTAR LIMITED HK\n\n**Hook 3 giây đầu:** Game mở đầu bằng cảnh chọn class/nghề nghiệp nhân vật với text \"每8秒强力AOE\" (AOE mạnh mẽ mỗi 8 giây), kèm ngón tay chỉ dẫn chọn Monk (võ sư). Ngay lập tức kích thích tò mò về sức mạnh kỹ năng.\n\n**Hình thức:** Video gameplay实录 + UI hướng dẫn chọn nghề.\n\n**Điểm đáng học hỏi:**\n- Cách đặt con số cụ thể (\"8 giây\") tạo cảm giác minh bạch và hứa hẹn sức mạnh.\n- Dùng hình ảnh \"click finger\" dẫn dắt người xem, giảm friction.\n- Bảng thuộc tính (属性面板) hiển thị real-time khi nhân vật chiến đấu, tạo cảm giác \"hệ thống game sâu\" dù là idle.\n\n**Creative tiêu biểu:** Creative:[b6506](https://appgrowing-global.youcloud.com/material/b6506238fff1972141af44de36fb3eb8-202) (impression 96,650), Creative:[236e4](https://appgrowing-global.youcloud.com/material/236e423d4bba9a0b3a945f956bbed333-202) (impression 40,145), Creative:[be0e2](https://appgrowing-global.youcloud.com/material/be0e25484ad6096f20ad4f856ccbd28f-202) (impression 63,420), Creative:[8e0da](https://appgrowing-global.youcloud.com/material/8e0da2b114bf2d76e37d3c5687d8f11e-202) (impression 54,371)\n\n---\n\n## 2. \"Stickman Go: Idle Game\" -- Pusilung\n\n**Hook 3 giây đầu:** Cảnh vẽ tay (hand-drawn) stickman cầm dao/kiếm trên nền giấy trắng với phong cách 2D cực kỳ đơn giản. Sự tương phản giữa nét vẽ đơn sơ và gameplay sau đó là hiệu ứng chiến đấu bùng nổ.\n\n**Hình thức:** Video \"meta\" kiểu vẽ tay trên giấy -\u003e chuyển sang gameplay thật.\n\n**Điểm đáng học hỏi:**\n- Phá vỡ kỳ vọng: bắt đầu cực kỳ đơn giản (vẽ tay), sau đó bùng sức mạnh tăng lên ngay trong quảng cáo.\n\n3. **Tối ưu cho zero-sound context**: Trên Unity Ads, AppLovin, ironSource (in-app ads), creative dùng visual text + icon thay vì voiceover. Các dòng text như \"New players should never...\" hay \"每8秒强力AOE\" đều được hiển thị bằng chữ to trên màn hình.\n\n4. **End card với CTA mạnh**: Cuối video, các creative hiệu quả đều có \"nút bắt đầu\" (Play Now / Install) kèm hiệu ứng lửa, ánh sáng -- không phải nút tĩnh.\n\n5. **Đa dạng hóa visual style trên cùng một genre**: Các game không chỉ dùng một style duy nhất. Họ kết hợp hand-drawn, 3D low-poly, card collection và pure gameplay để không bị \"fatigue\" bởi thuật toán.\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/YvaSc1JIlAXk8txmeGSmuw==",

                        "analysis":  "Sau quá trình tìm kiếm và phân tích dữ liệu quảng cáo từ YouTube và Google AdMob trong 30 ngày qua, tôi xin báo cáo kết quả như sau:\n\n---\n\n## Phân Tích Quảng Cáo Game Đối Thủ Cạnh Tranh Với Epic Stickman: Idle RPG War\n\n### Tổng Quan Tìm Kiếm\n\nTôi đã tìm kiếm qua **hơn 6.000 mẫu quảng cáo** (creative) từ các game stickman idle RPG trên YouTube và AdMob. Kết quả cho thấy:\n\n- **4 game đối thủ chính** được xác định trong cùng thể loại stickman idle RPG\n- Tuy nhiên, khi tìm kiếm trực tiếp theo App ID của từng game đối thủ trên YouTube và AdMob, **hệ thống trả về 0 kết quả** -- cho thấy các game này không có hoặc có rất ít chiến dịch quảng cáo đang chạy trên 2 nền tảng này trong 30 ngày qua.\n\n---\n\n### Danh Sách Game Đối Thủ (Cùng Thể Loại Stickman Idle RPG)\n\n| STT | Tên Game | Nhà Phát Hành | Tình Trạng Quảng Cáo |\n|-----|----------|--------------|----------------------|\n| 1 | **Stickman Go: Idle Game** | Pusilung | Không tìm thấy creative nào trên YouTube/AdMob (30 ngày gần nhất) |\n| 2 | **Stickman Idle Virus** | awk3620Games | Không tìm thấy creative nào trên YouTube/AdMob |\n| 3 | **Save The Stickman: Idle Empire** | ICEBEAR., JSC | Không tìm thấy creative nào trên YouTube/AdMob |\n| 4 | **Stickman: Idle Mafia** | RESTAR LIMITED HK | Không tìm thấy creative nào trên YouTube/AdMob |\n\n---\n\n### Phân Tích Cụ Thể Từng Game Đối Thủ\n\n#### 1. Stickman Go: Idle Game -- Pusilung\n\n- **Hook 3 giây đầu**: Không có dữ liệu creative trên YouTube/AdMob.\n- **Định dạng**: Không phát hiện.\n- **Điểm đáng học hỏi**: Dù không thấy quảng cáo trên YouTube/AdMob, game này cạnh tranh trực tiếp với Epic Stickman về thể loại idle + stickman. Có thể họ đang tập trung ngân sách vào các nền tảng khác như TikTok, Facebook, hoặc AppLovin.\n\n#### 2. Stickman Idle Virus -- awk3620Games\n\n- **Hook 3 giây đầu**: Không có dữ liệu.\n- **Định dạng**: Không phát hiện.\n- **Điểm đáng học hỏi**: Chủ đề \"virus\" kết hợp idle có thể là một góc nhấn khác biệt so với Epic Stickman (chiến tranh). Tuy nhiên, việc không chạy quảng cáo trên YouTube/AdMob cho thấy đây có thể là game nhỏ, ngân sách thấp.\n\n#### 3. Save The Stickman: Idle Empire -- ICEBEAR., JSC\n\n- **Hook 3 giây đầu**: Không có dữ liệu.\n- **Định dạng**: Không phát hiện.\n- **Điểm đáng học hỏi**: Tên game gợi ý cơ chế \"cứu\" và \"xây dựng đế chế\" -- một twist khác so với idle war thuần túy. ICEBEAR là studio có kinh nghiệm (phát hành nhiều game), nhưng không đầu tư mạnh vào YouTube/AdMob cho game này.\n\n#### 4. Stickman: Idle Mafia -- RESTAR LIMITED HK\n\n- **Hook 3 giây đầu**: Không có dữ liệu.\n- **Định dạng**: Không phát hiện.\n- **Điểm đáng học hỏi**: Chủ đề \"Mafia\" kết hợp idle RPG và stickman là một hướng sáng tạo. Đây có thể là đối thủ đáng chú ý nếu họ triển khai quảng cáo trên các nền tảng khác.\n\n---\n\n### Phân Tích Từ Dữ Liệu Tổng Quan \"Stickman Idle RPG\" Trên YouTube/AdMob\n\nTừ tìm kiếm mở rộng với từ khóa \"stickman idle rpg\", tôi thu được **509 mẫu quảng cáo**. Qua phân tích nội dung (visual_content và video_lines), phát hiện:\n\n**Phần lớn các quảng cáo (ước tính ~85-90%) thuộc về chính Epic Stickman: Idle RPG War**, dựa trên các dấu hiệu:\n- Video_lines chứa \"E Stman\" (viết tắt của Epic Stickman)\n- Nội dung \"Day one / Day 5 / Day 7\" -- format ngày tháng phổ biến\n- Hình ảnh stickman với vũ khí phát sáng, hệ thống cấp độ\n\n**Các mẫu quảng cáo còn lại (~10-15%)** là từ game RPG không phải stickman, hoặc game idle không phải stickman, hoặc các game thuộc thể loại khác trả về do matching từ khóa rộng.\n\n---\n\n### Xu Hướng Creative Đang Thắng Trên YouTube/AdMob Cho Thể Loại Này\n\nDựa trên các quảng cáo có hiệu suất cao nhất (impression cao nhất) từ dữ liệu tìm kiếm, xu hướng nổi bật gồm:\n\n1. **Format \"Ngày 1 --- Ngày 7\"**: Quảng cáo dạng timeline cho thấy sự tiến hóa của nhân vật từ yếu đến mạnh. Đây là format chiếm ưu thế với impression lên tới **hàng trăm nghìn** (vd: Creative:[2f55d](https://appgrowing-global.youcloud.com/material/2f55d46c77195775ee4109c9375f73bc-202) với 135K impression, Creative:[52d5d](https://appgrowing-global.youcloud.com/material/52d5ddb4699c313ced5581c0bf71fe45-202) với 133K impression).\n\n2. **So sánh 2001 vs 2008**: Hook hoài niệm \"Stickman năm 2001 đơn giản, đến 2008 chi tiết hơn\" tạo tò mò và cảm giác tiến hóa (Creative:[d5678](https://appgrowing-global.youcloud.com/material/d567875dc81af6bf1ef6d3f7aa56b737-202) với 116K impression).\n\n3. **Nhấn mạnh \"8 giây AOE\"**: Hook kỹ năng đặc biệt xuất hiện theo chu kỳ tạo cảm giác mạnh mẽ, dễ hiểu (nhiều creative trên 100K impression).\n\n4. **Thông điệp \"chơi miễn phí -- nhận thưởng lớn\"**: Kết thúc bằng CTA tặng code, gift box, tạo FOMO.\n\n---\n\n### Kết Luận\n\nThị trường quảng cáo trên YouTube và Google AdMob cho thể loại **stickman idle RPG** hiện tại gần như bị chi phối hoàn toàn bởi **Epic Stickman: Idle RPG War**. Các đối thủ cùng thể loại hầu như không xuất hiện hoặc có tần suất rất thấp trên 2 nền tảng này. Điều này cho thấy:\n- Epic Stickman đang có **lợi thế độc quyền** trên YouTube/AdMob cho category này\n- Các đối thủ có thể đang tập trung vào Facebook, TikTok, AppLovin, Mintegral hoặc các nền tảng khác\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/S8Jl3xDKz4ZAZhW2VfDCRQ==",

                        "analysis":  "# Phân tích Creative Đối thủ (ngách stickman idle RPG) trên TikTok \u0026 Pangle — Tháng 7/2026\n\n## 1. Phạm vi dữ liệu \u0026 phương pháp\n\n- Cửa sổ dữ liệu: 01/07/2026 – 31/07/2026 (ưu tiên creative mới nhất).\n- Hai network: TikTok (media_id 13) và Pangle (media_id 23).\n- Tổng rà soát: hơn 390 creative chứa tín hiệu \"stickman\" trên cả hai network; đồng thời truy vấn độc lập theo tên và ID của từng đối thủ trực tiếp trong thể loại (Stickman Legends, Stick War, Stick Saga, Stick Hero, Clash of Stickman, Stickman Party…).\n- Toàn bộ creative của \"Epic Stickman: Idle RPG War\" (Fansipan Limited) đã bị loại khỏi phân tích theo đúng yêu cầu. Các creative có lời thoại nhận diện thương hiệu riêng (giọng đọc \"E Stman\", chuỗi ngày \"Day 1/Day 7\", mô-típ tiến hóa 2001–2008) đều được xác định là của Epic Stickman và không được trích dẫn.\n- Giới hạn dữ liệu cần nêu rõ: ở một số cụm creative, dữ liệu trả về không kèm thông tin tên App/nhà phát hành ở cấp creative, nên tôi phân nhóm theo \"cụm sản phẩm/campaign\" và ghi chú mức độ chắc chắn thay vì suy đoán tên game.\n\n## 2. Phát hiện quan trọng: đối thủ trực tiếp gần như \"vắng bóng\" trên 2 network này\n\nTruy vấn theo tên/ID của các game stickman RPG cùng thể loại cho kết quả bằng 0 creative đang chạy trên TikTok và Pangle trong cửa sổ 30 ngày:\n\n| Đối thủ tiềm năng | Nhà phát hành | Creative trên TikTok/Pangle (07/2026) |\n|---|---|---|\n| Stickman Legends (các bản) | Zitga / Putaleng / Pen-Tool / GameFlex | 0 |\n| Stick War: Legacy | Max Games Studios | 0 |\n| Stick Saga: Endless War | PERCAS Viet Nam JSC | 0 |\n| Stick Hero – Tower Defense / Mighty Tower Wars | Sun Go Global, Unicorn, QUEEN CITY, TVC Global | 0 |\n| Stickman Party / Stickman io | Rivilution | 0 |\n| Clash of Stickman: Evolution | Velocita Z | 0 |\n\nKết luận sơ bộ: không gian quảng cáo \"stickman idle RPG\" trên TikTok/Pangle tháng 7/2026 đang bị chính Epic Stickman chiếm lĩnh gần như tuyệt đối (hàng chục creative chạy song song, 60–140 ad ID/creative, impression 300K–1M+). Các đối thủ cùng thể loại hoặc đã rút khỏi 2 network này, hoặc không còn mua media tại đây trong kỳ — đây là một khoảng trống share-of-voice rõ ràng.\n\n## 3. Các cụm creative stickman từ nhà phát hành KHÁC đang thực sự chạy\n\n### Cụm A — Casual \"crowd-run\" stickman (TikTok, volume lớn nhất)\n\nĐây là cụm stickman chiếm phần lớn tín hiệu tìm kiếm trên TikTok ngoài Epic Stickman: nhân vật stickman/khối tròn nhiều màu chạy đua, cơ chế nhân đôi điểm (x2, x100), kịch bản FAIL đỏ rồi thử lại.\n\n- Creative:[04fc1](https://appgrowing-global.youcloud.com/material/04fc1db8d415c6d42c2adf5475232d38-202)\n  - Hook 3 giây: mệnh lệnh trực diện \"Stop scrolling and watch this most addicting game ever\" + giọng đọc, cắt ngay cảnh chạy đua trên cao đô thị (19 ngày, 15 ad ID).\n  - Hình thức: video in-feed dọc TikTok, gameplay + voiceover, 32 giây.\n  - Điểm đáng học: chặn scroll bằng câu lệnh ở giây 0; khoe \"grab the big numbers\" để truyền tải cảm giác gây nghiện qua con số, không cần giới thiệu cốt truyện.\n- Creative:[c4794](https://appgrowing-global.youcloud.com/material/c4794b6ae2514f7e1d55b00b3e7b03d2-202)\n  - Hook 3 giây: chuỗi cảm thán \"Oh my God. Oh my God…\" từ người thật (nam trung niên châu Á) kiểu UGC, sau đó mới vào gameplay stickman (8 ngày).\n  - Hình thức: video phong cách UGC (người thật + chữ vàng) chuyển gameplay.\n  - Điểm đáng học: phản ứng cảm xúc mãnh liệt 1 giây đầu tạo tò mò; \"người chơi thật\" tăng độ tin cậy, phù hợp định dạng giải trí của TikTok.\n- Creative:[2547c](https://appgrowing-global.youcloud.com/material/2547c16dbb19483c1709a29b80e7be47-202)\n  - Hook 3 giây: trận bóng đá stickman 3D với bảng \"GOAL\", sân vận động, bảng xếp hạng cờ quốc gia (27 ngày, 3 ad ID, 65K impression).\n  - Hình thức: video 3D cartoon in-feed.\n  - Điểm đáng học: gắn gameplay stickman vào bối cảnh quen thuộc (bóng đá, cờ quốc gia) để mở rộng tệp người xem ngoài game thủ; dùng yếu tố tụ tập đám đông làm điểm nhấn thị giác.\n- Creative:[3b0bd](https://appgrowing-global.youcloud.com/material/3b0bd8eea2f4629c085fa67d5a6e67da-202) (40 ngày, 74 ad ID, 166K impression) và Creative:[01c6c](https://appgrowing-global.youcloud.com/material/01c6c451c82dea0af1c076410776f647-202) (238 ngày, 67 ad ID, 137K impression): bằng chứng cụm này đang scale mạnh và chạy rất dài hơi, dùng nhiều biến thể ad ID để duy trì chi phí thấp.\n\n### Cụm B — Stickman action RPG trên Pangle (gần nhất với thể loại idle RPG)\n\nĐây là cụm có gameplay gần giống Epic Stickman nhất trong số creative không thuộc Fansipan.\n\n- Creative:[02d63](https://appgrowing-global.youcloud.com/material/02d631d0b9f5748912d1b83848e51902-202)\n  - Hook 3 giây: stickman cầm kiếm phát sáng chiến đấu trong rừng hoang, tag \"Level 7\" xuất hiện ngay — tín hiệu tiến trình (28 ngày, 9 ad ID).\n  - Hình thức: video gameplay in-feed trên Pangle, tối giản UI.\n  - Điểm đáng học: mở đầu bằng khoảnh khắc chiến đấu \"đã tay\" + con số cấp độ để người xem lập tức hiểu đây là game nhân vật tăng cấp; không lãng phí giây đầu vào giới thiệu.\n- Creative:[361cf](https://appgrowing-global.youcloud.com/material/361cfa1742770174a81c04924101a37f-202)\n  - Hook 3 giây: stickman trong phế tích + bảng thuộc tính \"tự do chọn\" (32 ngày, 13 ad ID).\n  - Hình thức: video gameplay + UI hệ thống.\n  - Điểm đáng học: nhấn vào chiều sâu build (thuộc tính/trang bị) như điểm khác biệt so với idle thuần; đánh trúng người chơi thích tùy biến nhân vật.\n\n### Cụm C — Image tĩnh stickman chạy dài hạn trên Pangle (impression lớn)\n\n- Creative:[24853](https://appgrowing-global.youcloud.com/material/248537987df152ec7245654942d01ee9-102): image, 690 ngày, 68 ad ID, 6.13 triệu impression.\n- Creative:[65d35](https://appgrowing-global.youcloud.com/material/65d354cb95710086dd2bfbec95687f56-102): image, 479 ngày, 275 ad ID, 562K impression.\n- Creative:[6561c](https://appgrowing-global.youcloud.com/material/6561cec100c5cadfa17f563bc302a93e-102): image, 641 ngày, 500 ad ID, 274K impression.\n- Creative:[2bddf](https://appgrowing-global.youcloud.com/material/2bddf9e7f41940b7ca50cb0d1d0f67f1-102): image, 724 ngày, 99 ad ID, 725K impression.\n- Điểm đáng học: chiến thuật image tĩnh chạy 600–700 ngày không đổi, nhân số ad set lên 275–500 để giữ impression khổng lồ với chi phí vận hành gần như bằng 0 — mô hình \"bền vững\" đối trọng với video tốn production.\n\n## 4. Xu hướng creative đang thắng trên TikTok \u0026 Pangle (tháng 7/2026)\n\n- TikTok: hook cảm xúc trực diện trong 0–1 giây (mệnh lệnh chặn scroll, cảm thán UGC \"Oh my God\", chữ FAIL đỏ) + kết hợp người thật với gameplay; ngôn ngữ phổ quát là \"con số nhân đôi\" (x2, x100) và đám đông tăng trưởng. Video dài 20–60 giây vẫn được dùng để kéo giữ chân.\n- Pangle: video gameplay ngắn thuần (không thoại) khoe level/bảng thuộc tính, cùng với image tĩnh chạy rất dài hơi; ít phụ thuộc kịch bản cảm xúc.\n- Không phát hiện creative playable/tương tác trong dữ liệu hai network này ở kỳ — dư địa cho ai thử nghiệm.\n- Khoảng trống chiến lược: các đối thủ stickman RPG lớn đang vắng mặt trên 2 network, trong khi dòng \"crowd-run stickman\" lại chiếm volume lớn — tín hiệu cho thấy người xem vẫn phản hồi tốt với nhân vật stickman, nhưng phần \"idle RPG\" đang phụ thuộc vào một mình Epic Stickman.\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/MBXl5ZKvBkXEc6ls87sPfg==",

                        "analysis":  "# Competitive Creative Intelligence — Stickman Idle RPG on Unity Ads / AppLovin / ironSource / Mintegral / Vungle\n\n**Scope note (methodology):** I analyzed the newest stickman-genre creatives surfaced on the 5 programmatic networks for Jun–Jul 2026 (sample of 300+ materials, filtered by min_dt_desc). All creatives attributable to \"Epic Stickman: Idle RPG War\" (Fansipan Limited) were excluded — e.g., the Chinese-language \"史诗火柴人放置RPG\" launch ad (Creative:[d8237](https://appgrowing-global.youcloud.com/material/d82378b650216336117d7e6cb5ab6b62-202)) was dropped from the pool. Since ad-level data does not expose store metadata, competitor identities below are clustered by creative signature (recurring game systems, art style, and hook structure), and the two named stickman competitors from the app database are flagged separately.\n\n---\n\n## 1. Competitor creative system: Class-select + timed skill-cycle (dominant system on Unity Ads \u0026 Vungle)\n\nThis is the most pervasive stickman idle-RPG creative system on these networks — a dark-fantasy stickman RPG built around job selection, a \"timed skill promise,\" and attribute-panel proof.\n\n- **Standout creatives:**\n  - Creative:[b6506](https://appgrowing-global.youcloud.com/material/b6506238fff1972141af44de36fb3eb8-202) — Unity Ads, 16 days, ~99.2K impressions, 7 ad variants\n  - Creative:[236e4](https://appgrowing-global.youcloud.com/material/236e423d4bba9a0b3a945f956bbed333-202) — Vungle, 29 days, ~40.5K impressions, 13 ad variants\n  - Creative:[b4923](https://appgrowing-global.youcloud.com/material/b49231534da0e46acfab10d68e36c48e-202) — Mintegral, 3 days, ~4.9K impressions, 15 ad variants\n  - Creative:[b7777](https://appgrowing-global.youcloud.com/material/b7777130772a91cf06da08262a0c4d4b-202) — Unity Ads, 2 days, 752 impressions\n  - Creative:[cdb76](https://appgrowing-global.youcloud.com/material/cdb76eeb0aaa17cbad821f2c387bafee-202) — Vungle, 4 days, 1.4K impressions\n- **3-second hook:** A Monk character card + a tap finger + on-screen text \"Every 8 seconds: massive AOE.\" The first 3 seconds sell a *specific, timed* power promise before any combat is shown.\n- **Format:** Vertical video, 25–59s, in-feed/rewarded placements (no playable format observed).\n- **Takeaway:** Idle RPG players respond to a *concrete* skill promise (\"every 8s AOE\") rather than abstract \"become stronger.\" The video then converts curiosity into conviction with level-109 characters, an attribute panel, and a one-tap \"Join now\" close.\n\n## 2. Competitor creative system: Attribute / level proof with damage explosion\n\nA second major system built on numeric growth proof — level numbers, attribute panels, and giant damage digits as the core persuasion device.\n\n- **Standout creatives:**\n  - Creative:[a3794](https://appgrowing-global.youcloud.com/material/a37949abea47572ca0de6dbb4ea94cd6-202) — Unity Ads, 20 days, ~123.8K impressions (highest in the niche sample)\n  - Creative:[5249f](https://appgrowing-global.youcloud.com/material/5249ff77799f0a4f6bc539504a73d282-202) — Vungle, 33 days, ~48.6K impressions, 14 ad variants\n  - Creative:[5e68c](https://appgrowing-global.youcloud.com/material/5e68cb49d6938080ac855a76f4f25f81-201) — Vungle, 35 days, ~45.8K impressions, 13 ad variants\n  - Creative:[7da65](https://appgrowing-global.youcloud.com/material/7da65a0cd39ea1d709885890deaf13d6-202) — Vungle, 25 days, ~21.4K impressions, 23 ad variants\n  - Creative:[7a973](https://appgrowing-global.youcloud.com/material/7a9739863b5daa11f46a80e82c48d26d-202) — Vungle, 22 days, ~12.8K impressions\n  - Creative:[f4b10](https://appgrowing-global.youcloud.com/material/f4b10348441298fef4d1f5322d22490f-202) — 5 days, 2 ad variants (level-213 character)\n- **3-second hook:** Attribute panel + a level-213/216 stickman + exploding damage numbers inside a ruined forest/cave scene — instant \"power level\" read.\n- **Format:** Vertical video, 28–59s; one variant (Creative:[454ed](https://appgrowing-global.youcloud.com/material/454edcf0b05cf67a5c5e3789524a82d7-202)) adds a teaching voiceover: \"New players should never immediately fight the tyrant dragon... upgrade first.\"\n- **Takeaway:** Numbers are the cheapest, most universal proof of an idle RPG\u0027s fantasy. The warning-style voiceover (\"don\u0027t fight the boss yet\") creates tension, then positions the game as the solution to that tension.\n\n## 3. Competitor creative system: Growth comparison with time labels\n\nAn emerging angle — showing weapon evolution and power growth tagged with elapsed-time labels to make idle progression tangible.\n\n- **Standout creatives:**\n  - Creative:[2d008](https://appgrowing-global.youcloud.com/material/2d008c23e15bb7489fbb674d31989834-202) — Vungle, 7 days, ~9.2K impressions, 18 ad variants\n  - Creative:[acd0f](https://appgrowing-global.youcloud.com/material/acd0f2821e003a478efc3dba8fd68e82-202) — Vungle, 17 days, ~4.2K impressions\n  - Creative:[bc9c4](https://appgrowing-global.youcloud.com/material/bc9c4e7cfdf78cfa499cd5dc1c0858eb-202) — Mintegral, 1 day, 500 impressions\n  - Creative:[864b4](https://appgrowing-global.youcloud.com/material/864b4999ed548b60f0ac685035abe67e-202) — Unity Ads, 1 day, 127 impressions\n- **3-second hook:** Weapon evolution path with time tags (weak gray weapon → glowing advanced weapon) + a forest combat scene — \"you will become this strong after X time.\"\n- **Format:** Vertical video, 15–30s, before/after split framing.\n- **Takeaway:** Time-driven growth (\"in N minutes/hours you look like this\") lowers the perceived commitment bar for idle RPG users and makes the idle loop itself the selling point.\n\n## 4. Competitor creative system: S/SSS-tier hero gacha\n\nA collector-focused variant using rarity reveals (S/SSS tier, 5-star ratings) as the opening hook.\n\n- **Standout creatives:**\n  - Creative:[832b9](https://appgrowing-global.youcloud.com/material/832b93885c7c298e1014a0e04d4c6d37-202) — Vungle, 1 day, 300 impressions\n  - Creative:[da00d](https://appgrowing-global.youcloud.com/material/da00d04b11101690d47414011b6259d1-202) — Unity Ads, 1 day, 477 impressions (SSS build system, hero \"GANTE\", 54s)\n- **3-second hook:** S-tier/SSS-tier card reveal with star rating and glowing rarity frame — gacha anticipation before any gameplay.\n- **Format:** Vertical video, 17–59s, card-draw animation + hero roster showcase.\n- **Takeaway:** Rarity-first hooks target collector-driven idle RPG players; effective as a complement to power-progression hooks, not as a standalone volume driver (low impressions in sample).\n\n## 5. Named stickman competitors in the app database (monitor list)\n\n- **Epic Stickman Battle** — publisher: Pizza Burger Games. Stickman battle vertical; no creatives cleanly attributable in the newest sample window.\n- **Stickman Battle Empires War** — publisher: Epic Stickman games. Same situation; treat as a watchlist competitor rather than an active creative benchmark on these networks.\n\n---\n\n## Trend conclusion — what is winning on these networks\n\n- **Front-load a concrete, timed power promise.** The highest-impression creatives (40K–124K) all put a specific skill/level promise in the first 3 seconds (timed AOE, level-213 proof), not logos or world-building.\n- **Numbers as the universal language.** Attribute panels, level IDs, and damage digits dominate the idle-RPG niche; long-lived variants (20–35 days) keep iterating on the same numeric-proof skeleton.\n- **Vertical video only.** No playable/interactive creatives appeared in the newest sample — all winning formats are 25–59s vertical videos tuned for rewarded/in-feed inventory on Unity Ads, Vungle, and Mintegral.\n- **Two hook families coexist:** \"skill/job promise\" for mass reach (Unity Ads) and \"rarity/gacha\" for collector segments (Vungle). Growth-comparison-with-time-labels is the fastest-rising third angle.\n- **Localized teaching voiceovers are emerging** as a differentiation layer on top of the numeric-proof formula (e.g., the \"don\u0027t fight the tyrant dragon before upgrading\" variant).\n\n---\n\n\n\n---\n对话详情: https://appgrowing-global.youcloud.com/ai-chat/detail/g8u5uan3jZ6iZ~jZ~er0Eg==",

// ---------- helpers ----------
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");}
function md(t){
  if(!t) return "";
  const lines=esc(t).split(/\r?\n/); let html="",inList=false;
  const flush=()=>{if(inList){html+="</ul>";inList=false;}};
  for(let ln of lines){
    if(/^\s*#{3,}\s+/.test(ln)){flush();html+="<h3>"+ln.replace(/^\s*#{3,}\s+/,"")+"</h3>";continue;}
    if(/^\s*#{1,2}\s+/.test(ln)){flush();html+="<h2>"+ln.replace(/^\s*#{1,2}\s+/,"")+"</h2>";continue;}
    if(/^\s*[-*•]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*[-*•]\s+/,""))+"</li>";continue;}
    if(/^\s*\d+\.\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.replace(/^\s*\d+\.\s+/,""))+"</li>";continue;}
    flush(); if(ln.trim()==="")continue; html+="<p>"+inline(ln)+"</p>";
  }
  flush(); return html;
}
const LS={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- derived data ----------
const NETS = DATA.networks||[];
const ENTRIES = DATA.entries||[];
const allDates=[...new Set(ENTRIES.map(e=>e.date))].sort();
const latestDate=allDates[allDates.length-1];
function prevEntry(net,date){
  const c=ENTRIES.filter(e=>e.network===net && e.date<date).sort((a,b)=>a.date.localeCompare(b.date));
  return c.length?c[c.length-1]:null;
}
function newIdSet(entry){
  const p=prevEntry(entry.network,entry.date);
  if(!p) return new Set();
  const prev=new Set((p.materials||[]).map(m=>String(m.id)));
  const s=new Set();
  (entry.materials||[]).forEach(m=>{if(!prev.has(String(m.id)))s.add(String(m.id));});
  return s;
}

}

}

// ---------- render: line chart (vanilla SVG) ----------
const COLORS=["#6ea8fe","#7ee787","#f0b429","#ff5c7a","#b083f0"];
function renderChart(){
  const el=document.getElementById("chart");
  if(allDates.length===0){el.innerHTML='<div class="placeholder">Chưa có dữ liệu.</div>';return;}
  const W=Math.max(520,allDates.length*90), H=220, pad=34;
  const series=NETS.map((n,i)=>({label:n.label,color:COLORS[i%COLORS.length],
    pts:allDates.map(d=>{const e=ENTRIES.find(x=>x.network===n.id&&x.date===d);return e?(e.materials||[]).length:0;})}));
  let maxV=1; series.forEach(s=>s.pts.forEach(v=>{if(v>maxV)maxV=v;}));
  const x=i=>pad+ (allDates.length<=1?W/2:(i*(W-2*pad)/(allDates.length-1)));
  const y=v=>H-pad-(v/maxV)*(H-2*pad);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">`;
  svg+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  svg+=`<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2a2f3a"/>`;
  allDates.forEach((d,i)=>{svg+=`<text x="${x(i)}" y="${H-pad+16}" fill="#9aa4b2" font-size="11" text-anchor="middle">${d.slice(5)}</text>`;});
  svg+=`<text x="${pad-6}" y="${y(maxV)+4}" fill="#9aa4b2" font-size="11" text-anchor="end">${maxV}</text>`;
  series.forEach(s=>{
    if(allDates.length>1){
      let dpath=s.pts.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
      svg+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    }
    s.pts.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`;});
  });
  svg+=`</svg>`;
  let leg=`<div class="legend">`+series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")+`</div>`;
  el.innerHTML=svg+leg;
}

// ---------- render: competitor table ----------
let compSort={k:"creatives",dir:-1};
function gatherCompetitors(){
  const rows=[];
  ENTRIES.filter(e=>e.date===latestDate).forEach(e=>{
    (e.competitors||[]).forEach(c=>{
      rows.push({network:e.networkLabel||e.network,game:c.game||"",publisher:c.publisher||"",
        creatives:Number(c.creatives)||0,hook:c.hook||"",format:c.format||"",region:c.region||"",why:c.why||""});
    });
  });
  return rows;
}
function renderCompetitors(){
  const el=document.getElementById("competitors");
  let rows=gatherCompetitors();
  if(!rows.length){el.innerHTML='<div class="placeholder">Chưa có dữ liệu đối thủ có cấu trúc — sẽ xuất hiện sau lần chạy tự động kế tiếp (08:00), khi prompt mới trả về bảng đối thủ.</div>';return;}
  rows.sort((a,b)=>{const k=compSort.k;let av=a[k],bv=b[k];if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}return (av>bv?1:av<bv?-1:0)*compSort.dir;});
  const cols=[["network","Network"],["game","Game"],["publisher","Nhà phát hành"],["creatives","#Creative"],["hook","Hook 3s"],["format","Format"],["region","Khu vực"],["why","Vì sao ăn"]];
  let h="<div class='tblwrap'><table><thead><tr>"+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{h+="<tr>"+cols.map(c=>`<td>${esc(String(r[c[0]]))}</td>`).join("")+"</tr>";});
  h+="</tbody></table></div>";
  el.innerHTML=h;
  el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;compSort.dir=(compSort.k===k?-compSort.dir:-1);compSort.k=k;renderCompetitors();});
}

// ---------- render: creative grid ----------
function renderGrid(){
  const dateF=document.getElementById("dateSel").value;
  const q=document.getElementById("search").value.trim().toLowerCase();
  let entries=ENTRIES.slice();
  if(activeNet!=="all") entries=entries.filter(e=>e.network===activeNet);
  if(dateF!=="all") entries=entries.filter(e=>e.date===dateF);
  if(q) entries=entries.filter(e=>(e.analysis||"").toLowerCase().includes(q));
  entries.sort((a,b)=>b.date.localeCompare(a.date)||a.network.localeCompare(b.network));
  const byDay={}; entries.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  const days=Object.keys(byDay).sort().reverse();
  const c=document.getElementById("content");
  if(!days.length){c.innerHTML='<div class="empty">Không có dữ liệu phù hợp.</div>';return;}
  let html="";
  days.forEach(d=>{
    html+=`<div class="day">📅 ${d}</div>`;
    byDay[d].forEach((e,idx)=>{
      const mats=e.materials||[]; const ns=newIdSet(e);
      const cid=("a_"+d+"_"+e.network+"_"+idx).replace(/[^a-z0-9_]/gi,"");
      html+=`<div class="card"><div class="card-head">
        <span class="net-tag">${e.networkLabel||e.network}</span>
        <span class="count">${mats.length} creative · ${ns.size} mới · ${mats.filter(m=>m.is_mentioned).length} AI nhấn mạnh</span>
        <span class="toggle" onclick="document.getElementById('${cid}').classList.toggle('collapsed')">Thu gọn/mở phân tích</span>
      </div><div class="analysis collapsed" id="${cid}">${md(e.analysis)}</div>`;
      const vis=mats.filter(m=>{
        if(showNewOnly && !ns.has(String(m.id))) return false;
        if(showStarOnly && LS.get("agg_star_"+m.id)!=="1") return false;
        return true;
      });
      if(vis.length){
        html+='<div class="grid">';
        vis.forEach(m=>{
          const isNew=ns.has(String(m.id));
          const starred=LS.get("agg_star_"+m.id)==="1";
          const note=esc(LS.get("agg_note_"+m.id,""));
          let badges='<div class="badges">';
          if(isNew) badges+='<span class="pill new">MỚI</span>';
          if(m.is_mentioned) badges+='<span class="pill ment">AI</span>';
          badges+='</div>';
          let thumb;
          if(!m.media){thumb='<div class="missing">Không có media<br>(mở Chi tiết)</div>';}
          else if(m.type==="video"){thumb=`<video class="thumb" src="${m.media}" muted preload="metadata" loop data-src="${m.media}" data-type="video" onmouseenter="this.play()" onmouseleave="this.pause()" onclick="openModal(this)"></video>`;}
          else{thumb=`<img class="thumb" src="${m.media}" loading="lazy" data-src="${m.media}" data-type="image" onclick="openModal(this)">`;}
          html+=`<div class="mat">${badges}<span class="star ${starred?'on':''}" data-id="${m.id}" onclick="toggleStar(this)">${starred?'★':'☆'}</span>
            ${thumb}
            <div class="noteWrap"><textarea class="note" placeholder="Ghi chú..." data-id="${m.id}" oninput="saveNote(this)">${note}</textarea></div>
            <div class="meta"><span>#${m.id}</span>${m.detail_url?`<a href="${m.detail_url}" target="_blank">Chi tiết ↗</a>`:""}</div>
          </div>`;
        });
        html+='</div>';
      } else {
        html+='<div class="placeholder" style="padding:12px 16px">Không có creative khớp bộ lọc.</div>';
      }
      html+='</div>';
    });
  });
  c.innerHTML=html;
}

function toggleStar(el){const id=el.dataset.id;const on=LS.get("agg_star_"+id)==="1";LS.set("agg_star_"+id,on?"0":"1");el.classList.toggle("on",!on);el.textContent=on?"☆":"★";}
function saveNote(el){LS.set("agg_note_"+el.dataset.id,el.value);}
function openModal(el){
  const src=el.dataset.src,type=el.dataset.type;
  const box=document.getElementById("modalBox");
  box.innerHTML = type==="video"
    ? `<video src="${src}" controls autoplay loop style="display:block"></video><a class="dl" href="${src}" target="_blank">Mở/tải bản gốc ↗</a>`
    : `<img src="${src}"><a class="dl" href="${src}" target="_blank">Mở bản gốc ↗</a>`;
  document.getElementById("modal").classList.add("open");
}
document.getElementById("modalX").onclick=()=>{document.getElementById("modal").classList.remove("open");document.getElementById("modalBox").innerHTML="";};
document.getElementById("modal").onclick=(e)=>{if(e.target.id==="modal"){e.currentTarget.classList.remove("open");document.getElementById("modalBox").innerHTML="";}};

function exportShortlist(){
  const rows=[["id","network","date","is_mentioned","note","detail_url","media_url"]];
  ENTRIES.forEach(e=>(e.materials||[]).forEach(m=>{
    if(LS.get("agg_star_"+m.id)==="1"){
      rows.push([m.id,e.networkLabel||e.network,e.date,m.is_mentioned?"1":"0",(LS.get("agg_note_"+m.id,"")||"").replace(/"/g,'""'),m.detail_url||"",m.media||""]);
    }
  }));
  if(rows.length===1){alert("Chưa có creative nào được lưu (★). Bấm ngôi sao trên creative để lưu.");return;}
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c)}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shortlist_creative.csv";a.click();
}

// ---------- init ----------
function init(){
  document.getElementById("anchor").textContent=DATA.anchor||"";
  document.getElementById("generated").textContent=DATA.generated?new Date(DATA.generated).toLocaleString("vi-VN"):"";
  // net chips
  const nc=document.getElementById("netChips");
  let chips='<span class="chip active" data-net="all">Tất cả network</span>';
  NETS.forEach(n=>chips+=`<span class="chip" data-net="${n.id}">${n.label}</span>`);
  nc.innerHTML=chips;
  nc.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{nc.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeNet=c.dataset.net;renderGrid();});
  // dates
  const ds=document.getElementById("dateSel");
  allDates.slice().reverse().forEach(d=>ds.innerHTML+=`<option value="${d}">${d}</option>`);
  ds.onchange=renderGrid;
  document.getElementById("search").oninput=renderGrid;
  document.getElementById("newBtn").onclick=(e)=>{showNewOnly=!showNewOnly;e.target.classList.toggle("on",showNewOnly);renderGrid();};
  document.getElementById("starBtn").onclick=(e)=>{showStarOnly=!showStarOnly;e.target.classList.toggle("on",showStarOnly);renderGrid();};
  document.getElementById("exportBtn").onclick=exportShortlist;
  renderTldr(); renderStats(); renderChart(); renderCompetitors(); renderGrid();
}
init();
</script>
